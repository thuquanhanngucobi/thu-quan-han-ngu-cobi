<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Luyện đọc Hán ngữ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Layout: một cột hẹp, danh sách phẳng trong một khung; thanh điều khiển cố định ở đáy khi đọc.
   Tông: xanh navy đậm, bạc làm nền và đường kẻ, nâu cho pinyin, vàng cho câu đang đọc và dấu đã đọc. */
:root {
  --bg: #EEF0F3;
  --surface: #FFFFFF;
  --fg: #14213D;
  --muted: #5A6578;
  --line: #CFD5DE;
  --accent: #1B2F5B;
  --accent-fg: #FFFFFF;
  --accent-soft: #E1E7F2;
  --py: #7A4E24;
  --gold: #B8860B;
  --hl: #F8E7A8;
  --font-ui: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-han: "Noto Serif SC", "Songti SC", "Source Han Serif SC", "SimSun", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1324; --surface: #132039; --fg: #E8ECF4; --muted: #9DA9C0; --line: #263659;
    --accent: #E0B64A; --accent-fg: #1A1405; --accent-soft: #1D2C4D; --py: #D8A56B; --gold: #E0B64A; --hl: #4A3C12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1324; --surface: #132039; --fg: #E8ECF4; --muted: #9DA9C0; --line: #263659;
  --accent: #E0B64A; --accent-fg: #1A1405; --accent-soft: #1D2C4D; --py: #D8A56B; --gold: #E0B64A; --hl: #4A3C12;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 16px; line-height: 1.55;
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 720px; margin: 0 auto; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font-family: inherit; }

.eyebrow { font-family: var(--font-han); font-size: 15px; color: var(--py); letter-spacing: .12em; margin: 0 0 6px; }
h1 { font-size: clamp(26px, 6vw, 34px); line-height: 1.2; margin: 0 0 8px; font-weight: 700; text-wrap: balance; }
.lede { color: var(--muted); margin: 0 0 22px; max-width: 60ch; }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; font-weight: 500; padding: 6px 0; margin-bottom: 10px; }
.back:hover { color: var(--fg); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }

.level { display: grid; grid-template-columns: 72px minmax(0,1fr) auto; align-items: center; gap: 12px; padding: 16px; border-top: 1px solid var(--line); }
.level:first-child { border-top: 0; }
a.level:hover { background: var(--accent-soft); }
.lv-han { font-family: var(--font-han); font-size: 28px; font-weight: 700; color: var(--py); }
.lv-txt b { display: block; font-size: 18px; }
.lv-txt small { color: var(--muted); font-size: 14px; }
.level.off { opacity: .62; }
.level.off .lv-han { color: var(--muted); }
.soon { font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }

.progress { color: var(--muted); font-size: 14px; margin: 0 0 12px; font-variant-numeric: tabular-nums; }
.lesson { display: grid; grid-template-columns: 32px minmax(0,1fr) auto; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--line); }
.lesson:first-child { border-top: 0; }
.lesson:hover { background: var(--accent-soft); }
.lesson .n { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.lesson .t-han { font-family: var(--font-han); font-size: 22px; font-weight: 700; line-height: 1.3; display: block; }
.lesson .t-vi { color: var(--muted); font-size: 14px; display: block; }
.lesson .meta { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; white-space: nowrap; }
.tick { width: 20px; height: 20px; color: var(--gold); }
.grp-h { padding: 8px 16px; background: var(--accent-soft); color: var(--py); font-size: 13px; font-weight: 700; letter-spacing: .04em; border-top: 1px solid var(--line); }
.grp-h:first-child { border-top: 0; }
.panel { border-top: 3px solid var(--gold); }

.reader-head { margin-bottom: 14px; }
.reader-head .t-han { font-family: var(--font-han); font-size: clamp(28px, 7vw, 38px); font-weight: 700; line-height: 1.25; margin: 0; }
.reader-head .t-vi { color: var(--muted); margin: 2px 0 0; }
.hint { color: var(--muted); font-size: 14px; margin: 10px 0 0; max-width: 62ch; }
.opts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin: 14px 0 14px; font-size: 14px; }
.opts .grp { display: flex; align-items: center; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; color: var(--fg); padding: 6px 12px; font-size: 14px; cursor: pointer; min-height: 34px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--py); font-weight: 600; }
.chk { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.chk input { width: 18px; height: 18px; accent-color: var(--accent); }
.notice { background: var(--hl); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin: 0 0 14px; }

.row { display: grid; grid-template-columns: 26px minmax(0,1fr) auto; gap: 10px; padding: 14px; border-top: 1px solid var(--line); cursor: pointer; }
.row:first-child { border-top: 0; }
.row .idx { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; padding-top: 24px; }
.row .txt { min-width: 0; }
.row .who { font-family: var(--font-han); font-size: 14px; font-weight: 700; color: var(--py); letter-spacing: .06em; }
.row .py { display: none; color: var(--py); font-size: 15px; line-height: 1.4; margin: 2px 0 2px; overflow-wrap: anywhere; }
.row .han { font-family: var(--font-han); font-weight: 500; font-size: clamp(23px, 6vw, 29px); line-height: 1.6; letter-spacing: .02em; overflow-wrap: anywhere; }
.row .vi { display: none; color: var(--muted); font-size: 15px; margin-top: 2px; }
.reader.show-py .py, .row.py-on .py { display: block; }
.reader.show-vi .vi, .row.vi-on .vi { display: block; }
.row.cur { background: var(--hl); }
.chips { display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
.chip { min-width: 34px; height: 28px; padding: 0 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--py); }
.chip:disabled { cursor: default; opacity: .8; }
.done-wrap { margin-top: 16px; }
.reader { padding-bottom: 104px; }

.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; }
.btn { min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-size: 15px; font-weight: 600; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--py); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); flex: 1; }
.btn.plain { min-height: 40px; font-weight: 500; font-size: 14px; }

/* Công cụ đánh dấu thời gian */
.tool-audio { width: 100%; margin: 12px 0; }
.tool-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.mark-row { display: grid; grid-template-columns: 26px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.mark-row:first-child { border-top: 0; }
.mark-row.next { background: var(--hl); }
.mark-row .han { font-family: var(--font-han); font-size: 18px; line-height: 1.5; overflow-wrap: anywhere; }
.mark-row .tm { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; min-width: 56px; text-align: right; }
.mark-row .idx { color: var(--muted); font-size: 13px; }
.out { width: 100%; min-height: 160px; margin-top: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.5; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<script type="text/plain" id="lesson-data">
=== 听音乐 | Nghe nhạc | | Quyển 2 - Bài 1 - Bài khóa 1
海伦 | 田中，你在做什么？ | Tiánzhōng, nǐ zài zuò shénme? | Tanaka, bạn đang làm gì thế?
田中 | 我在听音乐。 | Wǒ zài tīng yīnyuè. | Tôi đang nghe nhạc.
海伦 | 听什么音乐？ | Tīng shénme yīnyuè? | Nghe nhạc gì vậy?
田中 | 我在听中国音乐，很好听！ | Wǒ zài tīng Zhōngguó yīnyuè, hěn hǎotīng! | Tôi đang nghe nhạc Trung Quốc, rất hay!
海伦 | 你喜欢一边看书，一边听音乐？ | Nǐ xǐhuan yìbiān kàn shū, yìbiān tīng yīnyuè? | Bạn thích vừa đọc sách vừa nghe nhạc à?
田中 | 对，你喜欢听音乐吗？ | Duì, nǐ xǐhuan tīng yīnyuè ma? | Đúng, bạn có thích nghe nhạc không?
海伦 | 很喜欢，我常常一边走路，一边听音乐。 | Hěn xǐhuan, wǒ chángcháng yìbiān zǒulù, yìbiān tīng yīnyuè. | Rất thích, tôi thường vừa đi bộ vừa nghe nhạc.
田中 | 你喜欢唱歌吗？ | Nǐ xǐhuan chànggē ma? | Bạn có thích hát không?
海伦 | 我不喜欢唱歌，我只喜欢听歌。你呢？ | Wǒ bù xǐhuan chànggē, wǒ zhǐ xǐhuan tīng gē. Nǐ ne? | Tôi không thích hát, tôi chỉ thích nghe hát. Còn bạn?
田中 | 我很喜欢唱歌，我喜欢唱英文歌。 | Wǒ hěn xǐhuan chànggē, wǒ xǐhuan chàng Yīngwén gē. | Tôi rất thích hát, tôi thích hát tiếng Anh.
海伦 | 太好了，我很喜欢听英文歌。你唱一个，好吗？ | Tài hǎo le, wǒ hěn xǐhuan tīng Yīngwén gē. Nǐ chàng yí ge, hǎo ma? | Tuyệt quá, tôi rất thích nghe nhạc tiếng Anh. Bạn hát một bài nhé?
田中 | 不行，不行，下次吧！ | Bù xíng, bù xíng, xiàcì ba! | Không được, không được, lần sau nhé!

=== 爱好 | Sở thích | | Quyển 2 - Bài 1 - Bài khóa 2
欧文 | 卡玛拉，你平时喜欢做什么？ | Kǎmǎlā, nǐ píngshí xǐhuan zuò shénme? | Kamala, bình thường bạn thích làm gì?
卡玛拉 | 我喜欢打球，还喜欢看电影和电视。你呢？ | Wǒ xǐhuan dǎ qiú, hái xǐhuan kàn diànyǐng hé diànshì. Nǐ ne? | Tôi thích chơi bóng, còn thích xem phim và xem ti vi. Còn bạn?
欧文 | 我也喜欢看电影，我还喜欢看书和跳舞。 | Wǒ yě xǐhuan kàn diànyǐng, wǒ hái xǐhuan kàn shū hé tiàowǔ. | Tôi cũng thích xem phim, tôi còn thích đọc sách và nhảy.
卡玛拉 | 你喜欢跳什么舞？ | Nǐ xǐhuan tiào shénme wǔ? | Bạn thích nhảy điệu gì?
欧文 | 我喜欢跳街舞。你喜欢跳舞吗？ | Wǒ xǐhuan tiào jiēwǔ. Nǐ xǐhuan tiàowǔ ma? | Tôi thích nhảy hip-hop. Bạn có thích nhảy không?
卡玛拉 | 不喜欢，我只喜欢看别人跳舞。 | Bù xǐhuan, wǒ zhǐ xǐhuan kàn biérén tiàowǔ. | Không thích, tôi chỉ thích xem người khác nhảy.
欧文 | 你喜欢打球吗？ | Nǐ xǐhuan dǎ qiú ma? | Bạn có thích chơi bóng không?
卡玛拉 | 我喜欢打篮球。你喜欢吗？ | Wǒ xǐhuan dǎ lánqiú. Nǐ xǐhuan ma? | Tôi thích chơi bóng rổ. Bạn có thích không?
欧文 | 我不喜欢打球，我只喜欢看球。 | Wǒ bù xǐhuan dǎ qiú, wǒ zhǐ xǐhuan kàn qiú. | Tôi không thích chơi bóng, tôi chỉ thích xem bóng.
卡玛拉 | 我也喜欢看球，我很喜欢看NBA。 | Wǒ yě xǐhuan kàn qiú, wǒ hěn xǐhuan kàn NBA. | Tôi cũng thích xem bóng, tôi rất thích xem NBA.
欧文 | 我也是，下个周末我们一起看吧！ | Wǒ yě shì, xià ge zhōumò wǒmen yìqǐ kàn ba! | Tôi cũng vậy, cuối tuần sau chúng ta cùng xem nhé!

=== 几点上课 | Mấy giờ vào học | | Quyển 2 - Bài 2 - Bài khóa 1
海伦 | 欧文，现在几点？ | Ōuwén, xiànzài jǐ diǎn? | Owen, bây giờ mấy giờ rồi?
欧文 | 八点一刻。你今天几点上课？ | Bā diǎn yí kè. Nǐ jīntiān jǐ diǎn shàngkè? | Tám giờ mười lăm. Hôm nay mấy giờ bạn vào học?
海伦 | 九点。你呢？ | Jiǔ diǎn. Nǐ ne? | Chín giờ. Còn bạn?
欧文 | 我今天九点五十五（分）上课。 | Wǒ jīntiān jiǔ diǎn wǔshíwǔ (fēn) shàngkè. | Hôm nay tôi vào học lúc chín giờ năm mươi lăm (phút).
海伦 | 你几点下课？ | Nǐ jǐ diǎn xiàkè? | Mấy giờ bạn tan học?
欧文 | 十二点半。你呢？ | Shí'èr diǎn bàn. Nǐ ne? | Mười hai rưỡi. Còn bạn?
海伦 | 我也是。 | Wǒ yě shì. | Tôi cũng vậy.
欧文 | 中午我们一起吃饭吧。 | Zhōngwǔ wǒmen yìqǐ chīfàn ba. | Buổi trưa chúng ta cùng đi ăn nhé.
海伦 | 好！我们吃什么？ | Hǎo! Wǒmen chī shénme? | Được! Chúng ta ăn gì?
欧文 | 吃中国菜或者韩国菜吧。 | Chī Zhōngguó cài huòzhě Hánguó cài ba. | Ăn món Trung Quốc hoặc món Hàn Quốc nhé.
海伦 | 好，中午十二点半在学校门口见！ | Hǎo, zhōngwǔ shí'èr diǎn bàn zài xuéxiào ménkǒu jiàn! | Được, trưa 12 rưỡi gặp ở cổng trường!
欧文 | 十二点半见！ | Shí'èr diǎn bàn jiàn! | 12 rưỡi gặp nhé!

=== 几点起床 | Mấy giờ thức dậy | | Quyển 2 - Bài 2 - Bài khóa 2
海伦 | 欧文，你平时几点起床？ | Ōuwén, nǐ píngshí jǐ diǎn qǐchuáng? | Owen, bình thường mấy giờ bạn thức dậy?
欧文 | 有时候七点左右，有时候八点左右。你呢？ | Yǒu shíhou qī diǎn zuǒyòu, yǒu shíhou bā diǎn zuǒyòu. Nǐ ne? | Có lúc khoảng bảy giờ, có lúc khoảng tám giờ. Còn bạn?
海伦 | 我每天六点一刻起床。 | Wǒ měitiān liù diǎn yí kè qǐchuáng. | Mỗi ngày tôi dậy lúc sáu giờ mười lăm.
欧文 | 这么早！你平时几点睡觉？ | Zhème zǎo! Nǐ píngshí jǐ diǎn shuìjiào? | Sớm thế! Bình thường mấy giờ bạn đi ngủ?
海伦 | 九点或者十点左右睡。 | Jiǔ diǎn huòzhě shí diǎn zuǒyòu shuì. | Khoảng chín hoặc mười giờ thì ngủ.
欧文 | 怎么这么早？ | Zěnme zhème zǎo? | Sao sớm vậy?
海伦 | 因为我喜欢早睡早起。你呢？ | Yīnwèi wǒ xǐhuan zǎo shuì zǎo qǐ. Nǐ ne? | Vì tôi thích ngủ sớm dậy sớm. Còn bạn?
欧文 | 我平时十二点左右睡觉。 | Wǒ píngshí shí'èr diǎn zuǒyòu shuìjiào. | Bình thường tôi ngủ khoảng mười hai giờ.
海伦 | 怎么这么晚？ | Zěnme zhème wǎn? | Sao muộn vậy?
欧文 | 因为我每天都有很多事。 | Yīnwèi wǒ měitiān dōu yǒu hěn duō shì. | Vì mỗi ngày tôi đều có rất nhiều việc.

=== 电话号码 | Số điện thoại | | Quyển 2 - Bài 3 - Bài khóa 1
田中 | 美京，我明天可以给你打电话吗？ | Měijīng, wǒ míngtiān kěyǐ gěi nǐ dǎ diànhuà ma? | Mỹ Kinh, ngày mai tôi gọi điện cho bạn được không?

  /* ---------- Biểu tượng và thông báo ---------- */
  var ICON_PLAY = '<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M6 3.5v13l11-6.5z"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M5 3.5h3.5v13H5zM11.5 3.5H15v13h-3.5z"/></svg>';
  var ICON_TICK = '<svg class="tick" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Đã đọc"><circle cx="10" cy="10" r="8"/><path d="M6.5 10.3l2.4 2.4 4.6-5"/></svg>';
  var ICON_BACK = '<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 4.5L7 10l5.5 5.5"/></svg>';
  var ICON_NEXT = '<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 4.5L13 10l-5.5 5.5"/></svg>';
  var NO_TTS = 'Trình duyệt này chưa hỗ trợ đọc tự động. Hãy mở trang bằng Chrome, Edge hoặc Safari.';
  var NO_VOICE = 'Máy chưa có giọng đọc tiếng Trung hoặc giọng chưa phát được. Hãy cài giọng Chinese (zh-CN) trong phần Cài đặt ngôn ngữ hoặc Trợ năng của thiết bị, rồi thử lại.';
  var NO_AUDIO = 'Không phát được file audio của bài này. Trang tạm dùng giọng đọc tự động.';

  var view = document.getElementById('view');
  var synth = window.speechSynthesis || null;
  var voice = null;
  var done = {};
  try { (JSON.parse(localStorage.getItem(KEY) || '[]') || []).forEach(function (k) { done[k] = true; }); } catch (e) {}
  function saveDone() { try { localStorage.setItem(KEY, JSON.stringify(Object.keys(done))); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function pickVoice() {
    if (!synth) return;
    var vs = synth.getVoices() || [];
    voice = vs.filter(function (v) { return /^zh[-_]CN/i.test(v.lang); })[0] ||
            vs.filter(function (v) { return /^zh/i.test(v.lang); })[0] || null;
  }
  pickVoice();
  if (synth && synth.addEventListener) synth.addEventListener('voiceschanged', pickVoice);

  /* ---------- Trạng thái đọc ---------- */
  var run = 0, playing = false, timer = null, poll = null;
  var lesson = null, lessonId = 0, cursor = -1, finished = false;
  var au = null, audioBad = false;
  var rate = 0.85, shadow = true, gPy = false, gVi = false;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function $(sel) { return view.querySelector(sel); }
  function $$(sel) { return Array.prototype.slice.call(view.querySelectorAll(sel)); }
  function countDone() { return LESSONS.filter(function (l) { return done[l.han]; }).length; }
  function mode() {
    if (lesson && lesson.audio && !audioBad) return lesson.timed ? 'seg' : 'whole';
    return 'tts';
  }

  function showNotice(msg) {
    var n = $('#notice');
    if (!n) return;
    n.textContent = msg;
    n.hidden = false;
  }

  function updateUI() {
    var b = $('[data-act="play"]');
    if (!b) return;
    var m = mode();
    var label = playing ? 'Tạm dừng' : m === 'whole' ? 'Nghe cả bài' : finished ? 'Nghe lại' : cursor >= 0 ? 'Nghe tiếp' : 'Nghe tự động';
    b.innerHTML = (playing ? ICON_PAUSE : ICON_PLAY) + '<span>' + label + '</span>';
    b.setAttribute('aria-label', playing ? 'Tạm dừng' : label);
  }

  function setCurrent(i) {
    $$('.row.cur').forEach(function (r) { r.classList.remove('cur'); });
    var row = $('.row[data-i="' + i + '"]');
    if (!row) return;
    row.classList.add('cur');
    try { row.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' }); } catch (e) {}
  }

  function stopAll() {
    run++;
    playing = false;
    clearTimeout(timer);
    clearInterval(poll);
    try { if (au) au.pause(); } catch (e) {}
    try { if (synth) synth.cancel(); } catch (e) {}
    updateUI();
  }

  /* Giọng đọc tự động (dự phòng khi chưa có audio) */
  function sayTTS(text, my, onEnd) {
    if (!synth || typeof SpeechSynthesisUtterance === 'undefined') { showNotice(NO_TTS); stopAll(); return; }
    try { synth.cancel(); } catch (e) {}
    var u = new SpeechSynthesisUtterance(text.replace(/[…]+|\.{2,}/g, ' ').replace(/\d+(?:-\d+)+/g, function (m) { return m.replace(/\d/g, function (d) { return d + ' '; }).replace(/-/g, '，'); }));
    u.lang = 'zh-CN';
    if (voice) u.voice = voice;
    u.rate = rate;
    var t0 = 0;
    var wd = setTimeout(function () { if (my === run) { showNotice(NO_VOICE); stopAll(); } }, 5000);
    u.onstart = function () { t0 = Date.now(); clearTimeout(wd); };
    u.onend = function () { clearTimeout(wd); if (my !== run) return; onEnd(t0 ? Date.now() - t0 : 0); };
    u.onerror = function (ev) {
      clearTimeout(wd);
      if (my !== run) return;
      if (ev && (ev.error === 'canceled' || ev.error === 'interrupted')) return;
      showNotice(NO_VOICE);
      stopAll();
    };
    setTimeout(function () { if (my === run) { try { synth.speak(u); } catch (e) { showNotice(NO_VOICE); stopAll(); } } }, 80);
  }

  /* Audio thật: phát đoạn của câu i trong file nguyên bài */
  function getAudio() {
    if (!au) {
      au = new Audio();
      au.preload = 'auto';
      au.addEventListener('error', function () {
        if (!lesson || !lesson.audio || audioBad) return;
        audioBad = true;
        var was = playing;
        stopAll();
        showNotice(NO_AUDIO);
        updateUI();
      });
    }
    if (au.getAttribute('data-src') !== lesson.audio) {
      au.setAttribute('data-src', lesson.audio);
      au.src = lesson.audio;
    }
    return au;
  }
  function playSeg(i, my, onEnd) {
    var a = getAudio();
    var start = lesson.s[i].t;
    var next = i < lesson.s.length - 1 ? lesson.s[i + 1].t : null;
    function go() {
      if (my !== run) return;
      try { a.currentTime = start; } catch (e) {}
      var p = a.play();
      if (p && p.catch) p.catch(function () { if (my === run) { audioBad = true; stopAll(); showNotice(NO_AUDIO); updateUI(); } });
      clearInterval(poll);
      poll = setInterval(function () {
        if (my !== run) { clearInterval(poll); return; }
        var end = next === null ? (a.duration || 1e9) : next;
        if (a.ended || a.currentTime >= end - 0.04) {
          clearInterval(poll);
          a.pause();
          onEnd(Math.max(0, Math.min(a.currentTime, end) - start) * 1000);
        }
      }, 40);
    }
    if (a.readyState >= 1) go();
    else {
      var f = function () { a.removeEventListener('loadedmetadata', f); go(); };
      a.addEventListener('loadedmetadata', f);
      a.load();
    }
  }
  function speak(i, my, onEnd) {
    if (mode() === 'seg') playSeg(i, my, onEnd);
    else sayTTS(lesson.s[i].han, my, onEnd);
  }

  function finish() {
    run++;
    playing = false;
    finished = true;
    cursor = -1;
    $$('.row.cur').forEach(function (r) { r.classList.remove('cur'); });
    done[lesson.han] = true;
    saveDone();
    syncDoneBtn();
    updateUI();
  }

  function step(my) {
    if (my !== run || !playing) return;
    setCurrent(cursor);
    speak(cursor, my, function (dur) {
      var gap = shadow ? Math.max(1200, dur + 700) : 450;
      timer = setTimeout(function () {
        if (my !== run || !playing) return;
        if (cursor < lesson.s.length - 1) { cursor++; step(my); } else { finish(); }
      }, gap);
    });
  }

  function togglePlay() {
    if (playing) { stopAll(); return; }
    var n = $('#notice'); if (n) n.hidden = true;
    stopAll();
    playing = true;
    finished = false;
    if (mode() === 'whole') {
      var a = getAudio(), my = run;
      a.onended = function () { if (my === run) { playing = false; finished = true; done[lesson.han] = true; saveDone(); syncDoneBtn(); updateUI(); } };
      var p = a.play();
      if (p && p.catch) p.catch(function () { if (my === run) { audioBad = true; stopAll(); showNotice(NO_AUDIO); updateUI(); } });
      updateUI();
      return;
    }
    if (cursor < 0) cursor = 0;
    var my2 = run;
    updateUI();
    step(my2);
  }

  function speakOne(i) {
    stopAll();
    finished = false;
    cursor = i;
    setCurrent(i);
    updateUI();
    var n = $('#notice'); if (n) n.hidden = true;
    var my = run;
    if (mode() === 'seg') playSeg(i, my, function () {});
    else sayTTS(lesson.s[i].han, my, function () {});
  }

  function syncChips() {
    $$('.row').forEach(function (row) {
      [['py', gPy], ['vi', gVi]].forEach(function (p) {
        var chip = row.querySelector('.chip[data-k="' + p[0] + '"]');
        if (!chip) return;
        var local = row.classList.contains(p[0] + '-on');
        chip.disabled = p[1];
        chip.setAttribute('aria-pressed', (p[1] || local) ? 'true' : 'false');
      });
    });
  }
  function syncDoneBtn() {
    var b = $('[data-act="done"]');
    if (!b) return;
    var d = !!done[lesson.han];
    b.setAttribute('aria-pressed', d ? 'true' : 'false');
    b.textContent = d ? 'Đã đọc xong (bấm để bỏ đánh dấu)' : 'Đánh dấu đã đọc';
  }

  /* ---------- Các màn hình ---------- */
  function renderHome() {
    view.innerHTML =
      '<header><p class="eyebrow" lang="zh-Hans">汉语阅读</p>' +
      '<h1>Luyện đọc Hán ngữ</h1>' +
      '<p class="lede">Đọc thẳng Hán tự và nghe theo từng câu. Pinyin và nghĩa tiếng Việt chỉ mở ra khi bạn cần kiểm tra lại.</p></header>' +
      '<div class="panel">' +
      '<a class="level" href="#so-cap"><span class="lv-han" lang="zh-Hans">初级</span><span class="lv-txt"><b>Sơ cấp</b><small>HSK 2 → 3 · ' + LESSONS.length + ' bài khóa · Quyển 2</small></span>' + ICON_NEXT + '</a>' +
      '<div class="level off" aria-disabled="true"><span class="lv-han" lang="zh-Hans">中级</span><span class="lv-txt"><b>Trung cấp</b><small>HSK 3 → 4</small></span><span class="soon">Sắp có</span></div>' +
      '<div class="level off" aria-disabled="true"><span class="lv-han" lang="zh-Hans">高级</span><span class="lv-txt"><b>Cao cấp</b><small>HSK 4 trở lên</small></span><span class="soon">Sắp có</span></div>' +
      '</div>';
  }

  function renderLevel() {
    var lastG = null;
    var items = LESSONS.map(function (l, i) {
      var head = '';
      if (l.group && l.group !== lastG) { head = '<div class="grp-h">' + esc(l.group) + '</div>'; lastG = l.group; }
      return head + '<a class="lesson" href="#bai-' + (i + 1) + '"><span class="n">' + (i + 1) + '</span>' +
        '<span><span class="t-han" lang="zh-Hans">' + esc(l.han) + '</span><span class="t-vi">' + esc((l.kh ? l.kh + ' · ' : '') + l.vi) + '</span></span>' +
        '<span class="meta">' + l.s.length + ' câu' + (done[l.han] ? ICON_TICK : '') + '</span></a>';
    }).join('');
    view.innerHTML =
      '<a class="back" href="#">' + ICON_BACK + 'Các cấp độ</a>' +
      '<header><p class="eyebrow" lang="zh-Hans">初级</p><h1>Sơ cấp</h1>' +
      '<p class="lede">Chọn một bài, đọc Hán tự trước rồi mới mở pinyin hoặc nghĩa để đối chiếu.</p></header>' +
      '<p class="progress">Đã đọc ' + countDone() + '/' + LESSONS.length + ' bài</p>' +
      '<div class="panel">' + items + '</div>';
  }

  function renderReader(l, id) {
    lesson = l; lessonId = id; cursor = -1; finished = false; gPy = false; gVi = false; audioBad = false;
    var hint = l.timed ? 'Chạm vào một câu để nghe lại đúng câu đó.' :
      l.audio ? 'Nút Nghe cả bài phát audio từ đầu đến cuối. Chạm vào một câu để nghe bằng giọng đọc tự động.' :
      'Chạm vào một câu để nghe riêng câu đó.';
    var rows = l.s.map(function (s, i) {
      return '<div class="row" data-i="' + i + '"><span class="idx">' + (i + 1) + '</span>' +
        '<div class="txt"><div class="who" lang="zh-Hans">' + esc(s.who) + '</div><div class="py">' + esc(s.py) + '</div>' +
        '<div class="han" lang="zh-Hans" role="button" tabindex="0" aria-label="Nghe câu ' + (i + 1) + '">' + esc(s.han) + '</div>' +
        '<div class="vi">' + esc(s.vi) + '</div></div>' +
        '<div class="chips"><button class="chip" data-k="py" aria-pressed="false" aria-label="Xem pinyin câu ' + (i + 1) + '">Py</button>' +
        '<button class="chip" data-k="vi" aria-pressed="false" aria-label="Xem nghĩa tiếng Việt câu ' + (i + 1) + '">TV</button></div></div>';
    }).join('');
    function rb(label, v) { return '<button data-act="rate" data-rate="' + v + '" aria-pressed="' + (rate === v) + '">' + label + '</button>'; }
    var showRate = !l.audio;
    view.innerHTML =
      '<div class="reader" id="reader">' +
      '<a class="back" href="#so-cap">' + ICON_BACK + 'Sơ cấp</a>' +
      '<div class="reader-head"><p class="eyebrow">' + esc(l.label) + '</p><h1 class="t-han" lang="zh-Hans">' + esc(l.han) + '</h1><p class="t-vi">' + esc(l.vi) + '</p>' +
      '<p class="hint">' + hint + ' Nút Py và TV bên phải mỗi câu chỉ mở pinyin hoặc nghĩa cho câu đó.</p></div>' +
      '<div class="opts">' + (showRate ? '<div class="grp"><span>Tốc độ</span><span class="seg">' + rb('Chậm', 0.7) + rb('Vừa', 0.85) + rb('Thường', 1) + '</span></div>' : '') +
      (l.audio && !l.timed ? '' : '<label class="chk"><input type="checkbox" id="shadow"' + (shadow ? ' checked' : '') + '>Chừa nhịp để nhẩm theo</label>') + '</div>' +
      '<p class="notice" id="notice" role="status" hidden></p>' +
      '<div class="panel">' + rows + '</div>' +
      '<div class="done-wrap"><button class="btn plain" data-act="done" aria-pressed="false">Đánh dấu đã đọc</button></div>' +
      '</div>' +
      '<div class="bar"><div class="bar-in">' +
      '<button class="btn primary" data-act="play"></button>' +
      '<button class="btn" data-act="vi" aria-pressed="false" aria-label="Hiện nghĩa tiếng Việt cho cả bài">TV</button>' +
      '<button class="btn" data-act="py" aria-pressed="false" aria-label="Hiện pinyin cho cả bài">Pinyin</button>' +
      '</div></div>';
    updateUI();
    syncDoneBtn();
    if (!l.audio && !synth) showNotice(NO_TTS);
  }

  /* ---------- Công cụ đánh dấu thời gian cho giáo viên ---------- */
  var marks = [];
  function renderTimer(l, id) {
    lesson = l; lessonId = id;
    if (!l.audio) {
      view.innerHTML = '<a class="back" href="#bai-' + id + '">' + ICON_BACK + 'Về bài đọc</a><h1>Đánh dấu thời gian</h1>' +
        '<p class="lede">Bài này chưa có file audio. Điền đường dẫn audio ở dòng === của bài trong phần dữ liệu rồi mở lại trang này.</p>';
      return;
    }
    marks = l.s.map(function (x) { return x.t; });
    view.innerHTML =
      '<a class="back" href="#bai-' + id + '">' + ICON_BACK + 'Về bài đọc</a>' +
      '<header><p class="eyebrow" lang="zh-Hans">' + esc(l.han) + '</p><h1>Đánh dấu thời gian</h1>' +
      '<p class="lede">Bấm phát audio. Đúng lúc mỗi câu bắt đầu, bấm “Đánh dấu câu tiếp theo”. Làm xong, sao chép đoạn văn bản ở cuối trang và gửi lại để dán vào phần dữ liệu.</p></header>' +
      '<audio id="tAudio" class="tool-audio" controls preload="auto" src="' + esc(l.audio) + '"></audio>' +
      '<div class="tool-actions"><button class="btn primary" data-act="mark">Đánh dấu câu tiếp theo</button>' +
      '<button class="btn" data-act="unmark">Lùi một câu</button><button class="btn" data-act="reset">Làm lại</button></div>' +
      '<div class="panel" id="markList"></div>' +
      '<p class="hint">Kết quả để dán vào dữ liệu:</p><textarea class="out" id="out" readonly></textarea>' +
      '<div class="tool-actions" style="margin-top:8px"><button class="btn" data-act="copyout">Sao chép</button></div>';
    drawMarks();
  }
  function drawMarks() {
    var next = marks.indexOf(null);
    $('#markList').innerHTML = lesson.s.map(function (s, i) {
      return '<div class="mark-row' + (i === next ? ' next' : '') + '"><span class="idx">' + (i + 1) + '</span>' +
        '<span class="han" lang="zh-Hans">' + esc(s.who) + '：' + esc(s.han) + '</span>' +
        '<span class="tm">' + (marks[i] === null ? '—' : fmtTime(marks[i])) + '</span></div>';
    }).join('');
    var mb = $('[data-act="mark"]');
    mb.disabled = next === -1;
    mb.textContent = next === -1 ? 'Đã đánh dấu đủ ' + marks.length + ' câu' : 'Đánh dấu câu ' + (next + 1);
    var lines = ['=== ' + lesson.han + ' | ' + lesson.vi + ' | ' + lesson.audio];
    lesson.s.forEach(function (s, i) {
      lines.push([s.who, s.han, s.py, s.vi, marks[i] === null ? '' : fmtTime(marks[i])].join(' | '));
    });
    $('#out').value = lines.join('\n');
  }

  function route() {
    stopAll();
    var h = (location.hash || '').replace('#', '');
    var m = /^bai-(\d+)$/.exec(h), t = /^danh-dau-(\d+)$/.exec(h);
    if (h === 'so-cap') renderLevel();
    else if (m && LESSONS[+m[1] - 1]) renderReader(LESSONS[+m[1] - 1], +m[1]);
    else if (t && LESSONS[+t[1] - 1]) renderTimer(LESSONS[+t[1] - 1], +t[1]);
    else renderHome();
    window.scrollTo(0, 0);
  }

  /* ---------- Sự kiện ---------- */
  view.addEventListener('click', function (e) {
    var act = e.target.closest('[data-act]');
    if (act) {
      var a = act.getAttribute('data-act');
      if (a === 'play') togglePlay();
      else if (a === 'py' || a === 'vi') {
        var on = a === 'py' ? (gPy = !gPy) : (gVi = !gVi);
        $('#reader').classList.toggle('show-' + a, on);
        if (!on) $$('.row').forEach(function (r) { r.classList.remove(a + '-on'); });
        act.setAttribute('aria-pressed', on ? 'true' : 'false');
        syncChips();
      } else if (a === 'rate') {
        rate = parseFloat(act.getAttribute('data-rate'));
        $$('[data-act="rate"]').forEach(function (b) { b.setAttribute('aria-pressed', b === act ? 'true' : 'false'); });
      } else if (a === 'done') {
        if (done[lesson.han]) delete done[lesson.han]; else done[lesson.han] = true;
        saveDone();
        syncDoneBtn();
      } else if (a === 'mark') {
        var ta = document.getElementById('tAudio'), nx = marks.indexOf(null);
        if (ta && nx !== -1) { marks[nx] = Math.round(ta.currentTime * 10) / 10; drawMarks(); }
      } else if (a === 'unmark') {
        var last = -1;
        marks.forEach(function (v, i) { if (v !== null) last = i; });
        if (last !== -1) { marks[last] = null; drawMarks(); }
      } else if (a === 'reset') {
        marks = lesson.s.map(function () { return null; });
        drawMarks();
      } else if (a === 'copyout') {
        var o = document.getElementById('out');
        var ok = false;
        try { if (navigator.clipboard) navigator.clipboard.writeText(o.value).catch(function () { o.select(); }); ok = true; } catch (er) {}
        if (!ok) o.select();
        act.textContent = 'Đã sao chép';
        setTimeout(function () { act.textContent = 'Sao chép'; }, 1500);
      }
      return;
    }
    var chip = e.target.closest('.chip');
    if (chip) {
      if (chip.disabled) return;
      chip.closest('.row').classList.toggle(chip.getAttribute('data-k') + '-on');
      syncChips();
      return;
    }
    var r = e.target.closest('.row');
    if (r) speakOne(+r.getAttribute('data-i'));
  });
  view.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('han')) {
      e.preventDefault();
      speakOne(+e.target.closest('.row').getAttribute('data-i'));
    }
  });
  view.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'shadow') shadow = e.target.checked;
  });
  window.addEventListener('hashchange', function () { route(); au = null; });
  window.addEventListener('pagehide', function () { try { if (synth) synth.cancel(); } catch (e) {} try { if (au) au.pause(); } catch (e) {} });
  route();
})();
</script>

</body></html>
