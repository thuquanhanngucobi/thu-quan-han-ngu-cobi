<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mê Trận Ngự Pháp HSK3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ef;--card:rgba(255,255,255,.86);--ink:#2a2622;--muted:#6f675e;--line:#e6dccd;--accent:#1f3a5f;--ai:#fff;--soft:#e3eaf4;--ok:#2e7d4f;--oks:#e1f2e7;--bad:#9a6700;--bads:#fbf0d3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:rgba(33,30,27,.88);--ink:#f1ebe3;--muted:#a89f94;--line:#3a352f;--accent:#8fb4e8;--ai:#0e1a2b;--soft:#1f2c40;--ok:#6cc58c;--oks:#1f3326;--bad:#e8b84a;--bads:#3a3015}}
:root[data-theme="dark"]{--bg:#171513;--card:rgba(33,30,27,.88);--ink:#f1ebe3;--muted:#a89f94;--line:#3a352f;--accent:#8fb4e8;--ai:#0e1a2b;--soft:#1f2c40;--ok:#6cc58c;--oks:#1f3326;--bad:#e8b84a;--bads:#3a3015}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html{background:var(--bg)}body{margin:0;background:transparent;color:var(--ink);font:16px/1.6 "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:1.5rem;margin:6px 0}
.sub{color:var(--muted);margin:0 0 14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tag{font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--accent)}
.tag.lv{background:transparent;border:1px solid var(--line);color:var(--muted)}
.set{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;color:var(--ink);font:inherit;cursor:pointer}
.set b{font-size:1.15rem}.meta{color:var(--muted);font-size:.85rem}
.back{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:8px 0}
input[type=search]{width:100%;padding:12px 14px;margin-bottom:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
.st{font-size:1.05rem;margin:26px 0 10px;padding-left:10px;border-left:4px solid var(--accent)}
.st small{color:var(--muted);font-weight:400;margin-left:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.card.ok{border-color:var(--ok)}.card.bad{border-color:var(--bad)}
.qh{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.qn{font-weight:700;color:var(--accent)}
.qt{font-size:1.2rem;margin:4px 0 10px}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--ink)}
.hint{color:var(--muted);font-size:.88rem;margin:0 0 8px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.opt{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:1.1rem}
.opt:hover{border-color:var(--accent)}.opt input{accent-color:var(--accent)}.opt .k{color:var(--muted);font-size:.85rem}
.opt.right{background:var(--oks);border-color:var(--ok)}.opt.wrong{background:var(--bads);border-color:var(--bad)}
.si{margin:10px 0}.si .ln{font-size:1.2rem}
select,input[type=text]{font:inherit;font-size:1.1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
input[type=text]{width:100%;padding:8px 10px}
.sok{border-color:var(--ok)!important;background:var(--oks)!important}.sbad{border-color:var(--bad)!important;background:var(--bads)!important}
.pool,.built{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;padding:8px;border-radius:10px}
.built{border:2px dashed var(--line);margin-bottom:10px}
.tok{font:inherit;font-size:1.15rem;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tok:disabled{opacity:.3}.tok.in{background:var(--soft);border-color:var(--accent)}
.ws{font-size:1.2rem;padding:8px 12px;border-radius:10px;background:var(--bads);margin-bottom:10px}
.fb{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:.95rem}
.fb.ok{background:var(--oks);color:var(--ok)}.fb.bad{background:var(--bads);color:var(--bad)}
.fb .ex{color:var(--ink);display:block;margin-top:4px}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 20px;cursor:pointer;background:var(--accent);color:var(--ai)}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.s{padding:4px 12px;font-size:.85rem;font-weight:500}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.res{margin-top:20px;padding:18px;border-radius:14px;background:var(--soft);text-align:center}
.res .big{font-size:2.2rem;font-weight:800;color:var(--accent)}
.note{color:var(--muted);font-size:.9rem}
.rc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px;margin:12px 0}.rc summary{cursor:pointer;font-weight:600}.rc h3{font-size:1rem;margin:14px 0 6px;color:var(--accent)}.rc table{width:100%;border-collapse:collapse;font-size:.95rem}.rc td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}.rc td.zh{font-size:1.05rem}
.tok[draggable=true]{cursor:grab}.fb summary{cursor:pointer;color:var(--ok)}
.tabs{display:flex;gap:8px;margin:12px 0 8px}.tab{flex:1;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}.tab.on{background:var(--accent);color:var(--ai);border-color:var(--accent)}.exm{padding:8px 0;border-bottom:1px solid var(--line)}[hidden]{display:none!important}
.rc{background:none;border:0;padding:0;margin:8px 0}.rg{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}.rg summary{padding:12px 14px;cursor:pointer;font-weight:600;color:var(--accent)}.rb{padding:0 14px 12px}
:root{--sk1:#f6eed7;--sk2:#e9ddc0;--m1:#b9c6c3;--m2:#93a7aa;--m3:#62798a;--mist:#fffaf0;--moon:#f6dd93;--ink2:#3a4a55;--bn1:rgba(255,250,232,.92);--bn2:rgba(244,228,180,.86);--bnb:#d9c690}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sk1:#111a28;--sk2:#1b2536;--m1:#27384d;--m2:#1d2c40;--m3:#131e2e;--mist:#2b3b54;--moon:#c9b36a;--ink2:#0a111b;--bn1:rgba(26,34,48,.92);--bn2:rgba(20,28,42,.9);--bnb:#5b5230}}
:root[data-theme="dark"]{--sk1:#111a28;--sk2:#1b2536;--m1:#27384d;--m2:#1d2c40;--m3:#131e2e;--mist:#2b3b54;--moon:#c9b36a;--ink2:#0a111b;--bn1:rgba(26,34,48,.92);--bn2:rgba(20,28,42,.9);--bnb:#5b5230}
main{position:relative;z-index:1}
.set,.card,.rg,.tab,.res{box-shadow:0 2px 10px rgba(70,55,20,.08)}
#scene{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.mist{animation:drift 45s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.bn{position:relative;overflow:hidden;border:1px solid var(--bnb);border-radius:18px;padding:26px 24px 22px;margin:0 0 18px;background:linear-gradient(135deg,var(--bn1),var(--bn2));outline:1px solid var(--bnb);outline-offset:-6px;box-shadow:0 4px 18px rgba(70,55,20,.12)}
.bn-t{position:relative;z-index:2;padding-right:150px}
.eyebrow{font-size:.78rem;letter-spacing:.14em;font-weight:700;color:var(--muted)}
.bn-h{font-family:"Playfair Display","Noto Serif","Songti SC",Georgia,serif;font-weight:800;font-size:clamp(1.9rem,6.2vw,3rem);line-height:1.1;margin:6px 0 8px;color:var(--ink)}
.bn-s{margin:0;color:var(--muted);max-width:30em}
.wm{position:absolute;right:130px;bottom:-60px;font-size:230px;line-height:1;color:var(--accent);opacity:.07;font-family:"Noto Serif SC","Songti SC",serif;pointer-events:none}
.lts{position:absolute;top:0;right:96px;width:100px;height:130px;pointer-events:none;transform-origin:top right}
.lt{position:absolute;top:-6px;transform-origin:50% 0;animation:sway 3.8s ease-in-out infinite alternate}
.lt.a{left:0;width:46px}.lt.b{left:58px;width:40px;top:8px;animation-duration:4.6s;animation-delay:-1.4s}
.lt svg{display:block;width:100%;height:auto}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.seal{position:absolute;right:20px;top:34px;width:56px;height:56px;border-radius:6px;background:#1f3a5f;color:#e8c768;border:2px solid #e8c768;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:20px;line-height:1.05;transform:rotate(3deg);box-shadow:0 2px 6px rgba(0,0,0,.25);font-family:serif}
@media(max-width:520px){.bn-t{padding-right:104px}.lts{right:58px;transform:scale(.8)}.seal{right:10px;width:46px;height:46px;font-size:17px}.wm{font-size:170px;right:60px}}
.bn.sm{padding:14px 18px;cursor:pointer}.bn.sm .bn-h{font-size:clamp(1.25rem,4.5vw,1.6rem);margin:2px 0}.bn.sm .wm,.bn.sm .seal{display:none}.bn.sm .lts{transform:scale(.55)}.bn.sm .bn-t{padding-right:90px}
@media(prefers-reduced-motion:reduce){.lt,.mist{animation:none}}

{id:"hsk3-ba",level:"HSK3",name:"Câu chữ 把 (把字句)",title:"HSK 3 – Câu chữ 把",sub:"Cấu trúc S + 把 + O + V + thành phần khác. Làm hết 40 câu rồi bấm “Nộp bài”.",

  {t:"1. Cấu trúc cơ bản",rows:[["S + 把 + O + V + thành phần khác","我把作业做完了。"]],notes:["O sau 把 phải xác định (这本书、那个苹果、我的手机…), không dùng 一本书.","Động từ không đứng một mình: sau V phải có 了, bổ ngữ, 一下… (không nói 我把作业做)."]},
  {t:"2. Thành phần thường đi sau động từ",rows:[["V + 了","妈妈把衣服洗了。"],["V + bổ ngữ kết quả","我把作业做完了。 / 他把杯子打破了。"],["V + bổ ngữ xu hướng","他把椅子搬进来了。"],["V + 在 + nơi chốn","请把书放在桌子上。"],["V + 给 + người","他把礼物送给了朋友。"],["V + 成 + …","请把这个句子翻译成中文。"],["V + 一下 / lặp động từ","请你把房间打扫打扫。"]]},
  {t:"3. Vị trí của phủ định, trợ động từ, trạng từ",rows:[["S + 没(有)/不 + 把 + O + V…","我没把作业做完。"],["S + 想/要/应该 + 把 + O + V…","我想把这本书还给他。"],["S + 已经/常常… + 把 + O + V…","我已经把衣服洗干净了。"]],notes:["Phủ định, trợ động từ và trạng từ đứng TRƯỚC 把, không đứng sau.","Không dùng 把 với động từ chỉ trạng thái, tâm lý, cảm giác như 是、有、在、喜欢、知道、觉得、看见、听见."]}
 ],
