<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Từ Vựng Flashcard</title>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #2b2622; --brown-dark: #4a3525; --gold-earth: #b38b4d;
      --blue-water: #1e3a5f; --blue-light: #e6edf2;
      --paper: #fcf9f2; --line: #d8c9ad;
    }
    * { box-sizing: border-box; }

    html, body { background: transparent; }
    body {
      font-family: "Noto Serif", serif; margin: 0;
      padding: 16px 16px 40px;
      -webkit-overflow-scrolling: touch;
    }
    .container { max-width: 650px; margin: 0 auto; }

    /* THANH BỘ LỌC */
    .filter-wrapper {
      position: sticky; top: 0; z-index: 10;
      background: rgba(245, 238, 219, 0.95); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
      border: 1px solid var(--gold-earth); padding: 12px 20px; border-radius: 12px;
      margin-bottom: 28px; display: flex; justify-content: space-between; align-items: center; gap: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }
    select {
      padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line);
      background: white; color: var(--blue-water); font-weight: 700; font-size: 16px;
      font-family: inherit; outline: none; cursor: pointer; min-width: 0; max-width: 60%;
    }
    .total-count { font-size: 15px; font-weight: 600; color: var(--brown-dark); white-space: nowrap; }

    .card-list { display: flex; flex-direction: column; }

    /* ===== THẺ LẬT: CHIỀU CAO TỰ GIÃN THEO NỘI DUNG =====
       Hai mặt xếp chồng trong CÙNG 1 ô lưới, nên thẻ luôn cao bằng mặt cao hơn.
       Không còn ép height cố định => ảnh không thể tràn ra ngoài khung. */
    .flip-card { width: 100%; margin-bottom: 28px; perspective: 1000px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .flip-inner {
      display: grid; position: relative;
      transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }
    .flip-card.flipped .flip-inner { transform: rotateY(180deg); }

    .flip-face {
      grid-area: 1 / 1;
      min-height: 230px;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      background: var(--paper); border: 2px solid var(--line); border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06); display: flex;
      overflow: hidden;
    }

    /* MẶT TRƯỚC */
    .flip-front { padding: 22px 28px; align-items: center; justify-content: space-between; gap: 20px; }
    .front-left { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 10px; flex: 1; min-width: 0; }
    .front-left.no-img { align-items: center; text-align: center; }

    .index { font-size: 14px; color: var(--brown-dark); opacity: 0.7; font-weight: 600; letter-spacing: 1px; }
    .hanzi-row { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
    .no-img .hanzi-row { justify-content: center; }

    /* CHỮ HÁN SIÊU TO - tự thu nhỏ khi từ dài */
    .hanzi { font-family: "Ma Shan Zheng", cursive; font-size: 100px; color: var(--ink); line-height: 1; word-break: keep-all; }
    .hanzi.len-3 { font-size: 76px; }
    .hanzi.len-4 { font-size: 62px; }
    .hanzi.len-5 { font-size: 48px; }

    .audio-btn {
      flex-shrink: 0;
      background: white; border: 1px solid var(--blue-water); color: var(--blue-water);
      width: 42px; height: 42px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
      cursor: pointer; font-size: 18px; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .audio-btn:hover { background: var(--blue-water); color: white; }

    .pinyin-box { background: white; color: var(--blue-water); border: 1px solid var(--line); padding: 6px 18px; border-radius: 8px; font-size: 20px; font-weight: 700; font-family: sans-serif; }

    /* KHUNG ẢNH */
    .front-right { flex: 0 0 240px; height: 190px; }
    .vocab-img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; display: block; }
    .front-right.pending { display: none; }
    .emoji-tile {
      width: 100%; height: 100%; display: grid; place-items: center;
      font-size: 96px; line-height: 1;
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      background: rgba(255,255,255,0.75); border: 1px solid var(--line); border-radius: 12px;
    }

    /* MẶT SAU */
    .flip-back { transform: rotateY(180deg); flex-direction: column; justify-content: center; align-items: center; padding: 24px; text-align: center; }
    .meaning { font-size: 24px; font-weight: 700; color: var(--blue-water); margin-bottom: 14px; }
    .example { font-size: 19px; color: var(--ink); margin-bottom: 18px; line-height: 1.5; }

    .audio-example {
      background: white; border: 1px solid var(--blue-water); color: var(--blue-water);
      padding: 8px 24px; border-radius: 20px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; transition: 0.2s;
    }
    .audio-example:hover { background: var(--blue-water); color: white; }

    #loading { text-align: center; color: #fff; font-size: 18px; margin-top: 40px; background: rgba(0,0,0,0.5); padding: 12px 25px; border-radius: 8px; display: inline-block; }

    /* ===== ĐIỆN THOẠI ===== */
    @media (max-width: 600px) {
      body { padding: 10px 10px 30px; }
      .filter-wrapper { padding: 10px 12px; margin-bottom: 20px; }
      select { font-size: 15px; padding: 8px 10px; }
      .flip-card { margin-bottom: 20px; }

      .flip-front { flex-direction: column; padding: 16px; gap: 14px; justify-content: center; }
      .front-left { align-items: center; text-align: center; width: 100%; }
      .hanzi-row { justify-content: center; }
      .hanzi { font-size: 72px; }
      .hanzi.len-3 { font-size: 56px; }
      .hanzi.len-4 { font-size: 46px; }
      .hanzi.len-5 { font-size: 36px; }
      .pinyin-box { font-size: 18px; }

      .front-right { flex: none; width: 100%; height: 130px; }
      .emoji-tile { font-size: 72px; }

      .meaning { font-size: 21px; }
      .example { font-size: 17px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div style="text-align: center;"><div id="loading">Đang nạp từ vựng...</div></div>

    <div id="app-content" style="display: none;">
      <div class="filter-wrapper">
        <select id="lesson-select"></select>
        <div class="total-count" id="total-text"></div>
      </div>
      <div class="card-list" id="card-list"></div>
    </div>
  </div>

  <!-- Link API lấy từ config.js ở thư mục gốc (chỉ sửa link ở đó) -->
  <script src="../../config.js"></script>
  <script>
    let allVocab = [];
    const listEl = document.getElementById('card-list');
    const selectEl = document.getElementById('lesson-select');
    const totalEl = document.getElementById('total-text');
    const loadingEl = document.getElementById('loading');

    // Link API dự phòng: chỉ dùng khi config.js không có COBI_API_URL (bản config.js cũ)
    const FALLBACK_API = 'https://script.google.com/macros/s/AKfycby1TyfXxZVmt2aoSIwOaNXxrrSmOXIHv-CVAU-B_9Xiv-Dxt4LyW2Yd1DSaJIOg4pfUIw/exec';

    // Chuẩn hóa tên cột ngay tại trình duyệt: "Hán tự", "HÁN TỰ", "hantu" đều thành "hantu"
    // => chạy được cả với code.gs cũ lẫn code.gs mới.
    const normKey = (s) => String(s).toLowerCase().normalize('NFD')
      .replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/[^a-z0-9]/g, '');
    const normItem = (raw) => {
      const o = {};
      Object.keys(raw).forEach(k => { const nk = normKey(k); if (nk) o[nk] = raw[k] == null ? '' : String(raw[k]); });
      return o;
    };

    async function loadVocab() {
      const base = (typeof COBI_API_URL !== 'undefined') ? COBI_API_URL : FALLBACK_API;
      const res = await fetch(base + '?action=getVocabLesson&t=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      if (!json.success) throw new Error(json.message || 'API báo lỗi');
      return (json.data || []).map(normItem);
    }

    const get = (item, ...keys) => {
      for (const k of keys) { if (item[k]) return String(item[k]).trim(); }
      return '';
    };
    const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    async function fetchData() {
      try {
        const data = await loadVocab();
        allVocab = data.filter(item => get(item, 'hantu', 'tuvung'));
        if (allVocab.length === 0) {
          loadingEl.textContent = "Không tìm thấy dữ liệu (kiểm tra cột 'Hán tự' trong tab TV THEO BÀI).";
          return;
        }
        setupFilter();
        loadingEl.style.display = 'none';
        document.getElementById('app-content').style.display = 'block';
      } catch (error) {
        loadingEl.textContent = "Lỗi tải dữ liệu: " + error.message;
      }
    }

    function setupFilter() {
      const lessons = [...new Set(allVocab.map(item => get(item, 'baihoc') || 'Tất cả'))];
      selectEl.innerHTML = lessons.map(l => `<option value="${esc(l)}">${esc(l)}</option>`).join('');
      selectEl.addEventListener('change', (e) => renderCards(e.target.value));
      renderCards(lessons[0]);
    }

    function renderCards(lesson) {
      const filtered = allVocab.filter(item => (get(item, 'baihoc') || 'Tất cả') === lesson);
      totalEl.textContent = `Tổng: ${filtered.length} từ`;

      listEl.innerHTML = filtered.map((item, index) => {
        const num = String(index + 1).padStart(2, '0');
        const hanzi = get(item, 'hantu', 'tuvung');
        const pinyin = get(item, 'pinyin');
        const meaning = get(item, 'nghia');
        const example = get(item, 'vidu');
        const img = get(item, 'hinhanh');
        const emoji = img ? '' : (get(item, 'emoji') || findEmoji(meaning));   // Ô HINHANH trống => dùng biểu tượng hoạt hình theo nghĩa
        const lenClass = hanzi.length >= 5 ? 'len-5' : hanzi.length === 4 ? 'len-4' : hanzi.length === 3 ? 'len-3' : '';

        return `
          <div class="flip-card">
            <div class="flip-inner">
              <div class="flip-face flip-front">
                <div class="front-left ${(img || emoji) ? '' : 'no-img'}">
                  <div class="index">${num} / ${filtered.length}</div>
                  <div class="hanzi-row">
                    <div class="hanzi ${lenClass}">${esc(hanzi)}</div>
                    <button class="audio-btn" data-say="${esc(hanzi)}" aria-label="Phát âm">🔊</button>
                  </div>
                  <div class="pinyin-box">${esc(pinyin)}</div>
                </div>
                ${img
                  ? `<div class="front-right"><img class="vocab-img" src="${esc(img)}" alt="minh họa" loading="lazy" onerror="this.parentNode.classList.add('pending')"></div>`
                  : (emoji ? `<div class="front-right"><div class="emoji-tile">${emoji}</div></div>` : '')}
              </div>
              <div class="flip-face flip-back">
                <div class="meaning">${esc(meaning)}</div>
                <div class="example">${example ? esc(example) : '(Chưa có ví dụ)'}</div>
                ${example ? `<button class="audio-example" data-say="${esc(example)}">🔊 Nghe ví dụ</button>` : ''}
              </div>
            </div>
          </div>`;
      }).join('');

    }

      ['🔥','hỏa|nhiệt|lò|bếp|đốt'], ['💧','giọt nước|nước mắt|giọt|ướt|uống nước lọc'], ['⚡','điện|dòng điện|điện năng|sét đánh|tia chớp|chớp'], ['🌐','mạng|internet|mạng internet|trang web|website|mạng xã hội|trực tuyến|trên mạng|mạng lưới|online'], ['📶','wifi|sóng wifi|mạng không dây|tín hiệu'], ['🔋','pin|sạc|pin sạc|sạc pin|năng lượng'], ['🧪','thí nghiệm|hóa học|hóa chất|khoa học|thực nghiệm|sinh học'], ['🔬','kính hiển vi|vi khuẩn|nghiên cứu khoa học'], ['🔭','kính thiên văn|thiên văn|vũ trụ|không gian'], ['📐','toán|toán học|hình học|tính toán|phép tính|số học|đại số'], ['🌐','ngôn ngữ|tiếng|tiếng nước ngoài|ngoại ngữ|ngữ|tiếng anh|tiếng trung|tiếng việt|tiếng hán|tiếng nhật|tiếng hàn|hán ngữ|tiếng pháp'], ['🏛️','lịch sử|văn hóa|chính phủ|nhà nước|chính quyền|bảo tàng|di tích|cổ đại|văn minh|văn hóa truyền thống|truyền thống'], ['⚖️','tòa án|xét xử|quyền|quyền lợi|công lý|án|vụ án'], ['🪖','quân đội|bộ đội|lính|quân nhân|chiến tranh|chiến đấu|chiến sĩ|binh lính'], ['🕊️','hòa bình|bình an|thanh bình|yên bình'], ['🍀','may mắn|vận may|hên|điềm lành|chúc may mắn'], ['🧧','lì xì|phong bao lì xì|bao lì xì|tiền mừng tuổi|mừng tuổi'], ['🏮','đèn lồng|lồng đèn'], ['🧨','pháo|pháo hoa|pháo nổ|pháo tết|đốt pháo'], ['🎆','pháo hoa|bắn pháo hoa'], ['🥢','kiểu ăn|ăn bằng đũa|món ăn trung quốc'], ['🐼','quốc bảo|gấu trúc|bảo bối'], ['🏯','vạn lý trường thành|tử cấm thành|cung điện trung quốc'], ['🧧','may mắn tết|phúc|phước|phúc lộc|chữ phúc|hạnh phúc năm mới']
    ];

    const EMOJI_MAP = {};
    EMOJI_LIST.forEach(([emoji, words]) => {
      words.split('|').forEach(w => { w = w.trim().toLowerCase(); if (w && !(w in EMOJI_MAP)) EMOJI_MAP[w] = emoji; });
    });

    // Tách nghĩa tiếng Việt thành từng cụm ngắn rồi tra từ điển (khớp nguyên cụm, không khớp lỏng).
    function findEmoji(meaning) {
      const segs = String(meaning || '')
        .toLowerCase()
        .replace(/\([^)]*\)|\[[^\]]*\]/g, ' ')
        .split(/[;,\/\n]/)
        .map(s => s.replace(/^\s*(n|v|adj|adv|dt|đt|tt|pt)\.?\s+/i, '').replace(/\s+/g, ' ').trim())
        .filter(Boolean)
        .slice(0, 4);
      for (const seg of segs) {
        if (EMOJI_MAP[seg]) return EMOJI_MAP[seg];
        const bare = seg.replace(/^(cái|con|chiếc|quả|trái|cây|người|một|các|những|việc|sự|bức|tấm|quyển|cuốn|bộ|bài|tờ|vị|đứa|bữa|món)\s+/, '');
        if (bare !== seg && EMOJI_MAP[bare]) return EMOJI_MAP[bare];
      }
      return '';
    }

    // Một bộ lắng nghe chung: bấm nút loa thì phát âm, bấm chỗ khác thì lật thẻ
    listEl.addEventListener('click', (e) => {
      const sayBtn = e.target.closest('[data-say]');
      if (sayBtn) { playAudio(sayBtn.dataset.say); return; }
      const card = e.target.closest('.flip-card');
      if (card) card.classList.toggle('flipped');
    });

    function playAudio(text) {
      if (!text || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-CN'; u.rate = 0.85;
      window.speechSynthesis.speak(u);
    }

    fetchData();
  </script>
