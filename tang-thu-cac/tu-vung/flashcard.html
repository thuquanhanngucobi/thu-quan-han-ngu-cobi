<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Từ Vựng Flashcard</title>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #2b2622; --brown-dark: #4a3525; --gold-earth: #b38b4d;
      --blue-water: #1e3a5f; --blue-light: #e6edf2;
      --paper: #fcf9f2; --line: #d8c9ad;
    }
    
    body { font-family: "Noto Serif", serif; background: transparent; margin: 0; padding: 20px 20px 60px; min-height: 100vh; }
    .container { max-width: 650px; margin: 0 auto; } 

    /* THANH BỘ LỌC */
    .filter-wrapper {
      position: sticky; top: 0; z-index: 10;
      background: rgba(245, 238, 219, 0.95); backdrop-filter: blur(5px);
      border: 1px solid var(--gold-earth); padding: 15px 25px; border-radius: 12px; 
      margin-bottom: 35px; display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }
    
    select {
      padding: 10px 20px; border-radius: 8px; border: 1px solid var(--line);
      background: white; color: var(--blue-water); font-weight: 700; font-size: 16px;
      font-family: inherit; outline: none; cursor: pointer;
    }
    .total-count { font-size: 16px; font-weight: 600; color: var(--brown-dark); }

    .card-list { display: flex; flex-direction: column; }

    /* KHUNG THẺ LẬT - ÉP CỨNG CHIỀU CAO & KHOẢNG CÁCH */
    .flip-card { 
      width: 100%; 
      height: 220px; 
      margin-bottom: 35px; 
      perspective: 1000px; cursor: pointer; 
    }

    .flip-inner { width: 100%; height: 100%; transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; position: relative; }
    .flip-card.flipped .flip-inner { transform: rotateY(180deg); }

    .flip-face {
      position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
      background: var(--paper); border: 2px solid var(--line); border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06); display: flex; box-sizing: border-box;
    }

    /* MẶT TRƯỚC */
    .flip-front { padding: 25px 35px; align-items: center; justify-content: space-between; }
    .front-left { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 10px; flex: 1; }
    
    .index { font-size: 14px; color: var(--brown-dark); opacity: 0.7; font-weight: 600; letter-spacing: 1px; }
    .hanzi-row { display: flex; align-items: center; gap: 15px; }
    
    /* CHỮ HÁN SIÊU TO */
    .hanzi { font-family: "Ma Shan Zheng", cursive; font-size: 100px; color: var(--ink); line-height: 0.9; }

    .audio-btn {
      background: white; border: 1px solid var(--blue-water); color: var(--blue-water);
      width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
      cursor: pointer; font-size: 18px; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .audio-btn:hover { background: var(--blue-water); color: white; }

    .pinyin-box { background: white; color: var(--blue-water); border: 1px solid var(--line); padding: 6px 18px; border-radius: 8px; font-size: 20px; font-weight: 700; font-family: sans-serif; }

    /* KHUNG ẢNH GỌN GÀNG TỈ LỆ CHUẨN */
    .front-right { 
      flex: 0 0 260px; 
      height: 200px;   
      display: flex; align-items: center; justify-content: center; 
    }
    .vocab-img { 
      max-width: 100%; max-height: 100%; 
      object-fit: cover; 
      border-radius: 16px; 
    }

    /* MẶT SAU */
    .flip-back { transform: rotateY(180deg); flex-direction: column; justify-content: center; align-items: center; padding: 25px; text-align: center; }
    .meaning { font-size: 24px; font-weight: 700; color: var(--blue-water); margin-bottom: 15px; }
    .example { font-size: 20px; color: var(--ink); margin-bottom: 20px; line-height: 1.5; }

    .audio-example {
      background: white; border: 1px solid var(--blue-water); color: var(--blue-water);
      padding: 8px 24px; border-radius: 20px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; transition: 0.2s;
    }
    .audio-example:hover { background: var(--blue-water); color: white; }

    #loading { text-align: center; color: var(--paper); font-size: 18px; margin-top: 50px; background: rgba(0,0,0,0.5); padding: 12px 25px; border-radius: 8px; display: inline-block; }

    /* =========================================================
       ĐOẠN CSS MỚI: TỐI ƯU THẺ FLASHCARD TRÊN ĐIỆN THOẠI 
       ========================================================= */
    @media (max-width: 600px) {
      .flip-card { height: 380px; margin-bottom: 25px; }
      .flip-front { flex-direction: column; padding: 20px; align-items: center; text-align: center; }
      
      .front-left { width: 100%; align-items: center; gap: 10px; flex: unset; }
      .hanzi-row { justify-content: center; gap: 15px; }
      .hanzi { font-size: 70px; }
      .pinyin-box { font-size: 18px; padding: 6px 16px; }
      
      .front-right { width: 100%; height: 150px; margin-top: 15px; flex: unset; display: flex; justify-content: center; }
      .vocab-img { max-width: 100%; max-height: 150px; object-fit: contain; }
      
      .flip-back { padding: 20px 15px; }
      .meaning { font-size: 22px; margin-bottom: 15px; }
      .example { font-size: 18px; margin-bottom: 20px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div style="text-align: center;"><div id="loading">Đang nạp từ vựng...</div></div>
    
    <div id="app-content" style="display: none;">
      <div class="filter-wrapper">
        <select id="lesson-select"></select>
        <div class="total-count" id="total-text"></div>
      </div>
      <div class="card-list" id="card-list"></div>
    </div>
  </div>

  <script>
    // LINK API CỦA BẠN (Cập nhật ?action=getVocabLesson)
    const API_URL = 'https://script.google.com/macros/s/AKfycby1TyfXxZVmt2aoSIwOaNXxrrSmOXIHv-CVAU-B_9Xiv-Dxt4LyW2Yd1DSaJIOg4pfUIw/exec?action=getVocabLesson&t=' + new Date().getTime();
    
    let allVocab = [];
    const listEl = document.getElementById('card-list');
    const selectEl = document.getElementById('lesson-select');
    const totalEl = document.getElementById('total-text');

    async function fetchData() {
      try {
        const res = await fetch(API_URL);
        const json = await res.json();
        if (json.success && json.data.length > 0) {
          // Khóa chặt tên cột giống y như file Danh sách
          allVocab = json.data.filter(item => item['Hán tự'] || item['Hán Tự'] || item['TUVUNG']);
          
          if(allVocab.length === 0) {
            document.getElementById('loading').textContent = "Không tìm thấy dữ liệu ở cột 'Hán tự'.";
            return;
          }

          setupFilter();
          document.getElementById('loading').style.display = 'none';
          document.getElementById('app-content').style.display = 'block';
        } else {
          document.getElementById('loading').textContent = "Không tìm thấy dữ liệu.";
        }
      } catch (error) {
        document.getElementById('loading').textContent = "Lỗi tải dữ liệu. Hãy kiểm tra lại link API.";
      }
    }

    function setupFilter() {
      // Dùng cột ID hoặc Bài học làm tiêu chí lọc
      const lessons = [...new Set(allVocab.map(item => item['ID'] || item['Bài học'] || 'Tất cả'))];
      selectEl.innerHTML = lessons.map(l => `<option value="${l}">${l}</option>`).join('');
      selectEl.addEventListener('change', (e) => renderCards(e.target.value));
      renderCards(lessons[0]);
    }

    function renderCards(lesson) {
      const filtered = allVocab.filter(item => (item['ID'] || item['Bài học'] || 'Tất cả') === lesson);
      totalEl.textContent = `Tổng: ${filtered.length} từ`;
      
      listEl.innerHTML = filtered.map((item, index) => {
        const num = (index + 1).toString().padStart(2, '0');
        // Quét chuẩn tên cột theo file Excel mới
        const hanzi = item['Hán tự'] || item['Hán Tự'] || item['TUVUNG'] || '';
        const pinyin = item['PINYIN'] || item['Pinyin'] || '';
        const meaning = item['NGHIA'] || item['Nghĩa'] || '';
        const example = item['VIDU'] || item['Ví dụ'] || '';
        const img = item['HINHANH'] || item['Hình ảnh'] || '';
        
        const hasImg = img.trim() !== '';

        return `
          <div class="flip-card" onclick="this.classList.toggle('flipped')">
            <div class="flip-inner">
              <!-- MẶT TRƯỚC -->
              <div class="flip-face flip-front">
                <div class="front-left" style="${!hasImg ? 'align-items: center; text-align: center;' : ''}">
                  <div class="index" style="${!hasImg ? 'width: 100%;' : ''}">${num} / ${filtered.length}</div>
                  <div class="hanzi-row">
                    <div class="hanzi">${hanzi}</div>
                    <button class="audio-btn" onclick="playAudio(event, '${hanzi}')">🔊</button>
                  </div>
                  <div class="pinyin-box">${pinyin}</div>
                </div>
                ${hasImg ? `<div class="front-right"><img class="vocab-img" src="${img}" alt="minh họa"></div>` : ''}
              </div>
              <!-- MẶT SAU -->
              <div class="flip-face flip-back">
                <div class="meaning">${meaning}</div>
                <div class="example">${example || '(Chưa có ví dụ)'}</div>
                ${example ? `<button class="audio-example" onclick="playAudio(event, '${example}')">🔊 Nghe ví dụ</button>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function playAudio(event, text) {
      event.stopPropagation();
      if (!text) return;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN'; u.rate = 0.85;
        window.speechSynthesis.speak(u);
      }
    }
    fetchData();
  </script>
</body>
</html>
