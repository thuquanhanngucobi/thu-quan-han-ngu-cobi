<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh Sách Từ Vựng</title>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #2b2622; --brown-dark: #4a3525; --gold-earth: #b38b4d;
      --blue-water: #1e3a5f; --blue-light: #e6edf2;
      --paper: rgba(245, 238, 219, 0.95); --line: #d8c9ad;
    }
    
    body { 
      font-family: "Noto Serif", serif; background: transparent; 
      margin: 0; padding: 20px 20px 60px; color: var(--ink);
    }
    .container { max-width: 900px; margin: 0 auto; }

    /* THANH TÌM KIẾM & BỘ LỌC */
    .top-controls {
      position: sticky; top: 0; z-index: 10;
      background: var(--paper); backdrop-filter: blur(5px);
      border: 1px solid var(--gold-earth); padding: 20px; border-radius: 16px; 
      margin-bottom: 30px; display: flex; gap: 20px; align-items: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }

    .search-box { flex: 1; }
    .search-box input {
      width: 100%; padding: 12px 20px; border-radius: 12px; border: 1px solid var(--line);
      font-family: inherit; font-size: 16px; outline: none; transition: 0.3s;
      background: #fdfbf7; color: var(--blue-water);
    }
    .search-box input:focus { border-color: var(--blue-water); box-shadow: 0 0 0 3px var(--blue-light); }

    .hsk-filter {
      padding: 12px 20px; border-radius: 12px; border: 1px solid var(--line);
      background: white; color: var(--blue-water); font-weight: 700; font-size: 16px;
      font-family: inherit; outline: none; cursor: pointer;
    }

    /* BẢNG TỪ VỰNG */
    .table-wrapper {
      background: var(--paper);
      border-radius: 16px;
      border: 1px solid var(--gold-earth);
      overflow: hidden; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    
    th { 
      background: var(--blue-water); color: white; 
      padding: 18px 20px; font-weight: 600; font-size: 16px; letter-spacing: 1px;
    }
    
    td { 
      padding: 16px 20px; border-bottom: 1px dashed var(--line); 
      vertical-align: middle; color: var(--brown-dark); font-size: 16px;
    }
    
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.4); }

    .hanzi-cell { 
      font-family: "Ma Shan Zheng", cursive; font-size: 42px; 
      color: var(--ink); line-height: 1; display: flex; align-items: center; gap: 15px;
    }

    .pinyin-cell { font-weight: 700; color: var(--blue-water); font-family: sans-serif; font-size: 20px; }

    /* NÚT ÂM THANH */
    .audio-btn {
      background: white; border: 1px solid var(--blue-water); color: var(--blue-water);
      width: 38px; height: 38px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
      cursor: pointer; font-size: 18px; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      flex-shrink: 0;
    }
    .audio-btn:hover { background: var(--blue-water); color: white; transform: scale(1.1); }

    #loading { text-align: center; color: var(--paper); font-size: 18px; margin-top: 50px; background: rgba(0,0,0,0.5); padding: 12px 25px; border-radius: 12px; display: inline-block; }

    @media (max-width: 700px) {
      .top-controls { flex-direction: column; }
      .search-box { width: 100%; }
      .hsk-filter { width: 100%; }
      table, thead, tbody, th, td, tr { display: block; }
      th { display: none; }
      td { position: relative; padding-left: 110px; min-height: 50px; }
      td::before { 
        content: attr(data-label); position: absolute; left: 15px; top: 18px; 
        font-weight: 600; color: var(--blue-water); font-size: 14px;
      }
      .hanzi-cell { font-size: 36px; padding-left: 110px !important; }
      .hanzi-cell::before { top: 25px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div style="text-align: center;"><div id="loading">Đang tải danh sách từ vựng...</div></div>
    
    <div id="app-content" style="display: none;">
      
      <div class="top-controls">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="Nhập Hán tự, Pinyin hoặc Nghĩa để tìm kiếm...">
        </div>
        <select id="hsk-select" class="hsk-filter">
          <option value="all">Tất cả bài học</option>
        </select>
      </div>

      <div class="table-wrapper">
        <table id="vocab-table">
          <thead>
            <tr>
              <th>Hán Tự</th>
              <th>Pinyin</th>
              <th>Nghĩa Tiếng Việt</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- Dữ liệu render tại đây -->
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <script>
    // Link API cập nhật chính xác
    const API_URL = 'https://script.google.com/macros/s/AKfycby1TyfXxZVmt2aoSIwOaNXxrrSmOXIHv-CVAU-B_9Xiv-Dxt4LyW2Yd1DSaJIOg4pfUIw/exec?action=getVocabHSK&t=' + new Date().getTime();
    
    let allVocab = [];
    const tbody = document.getElementById('table-body');
    const searchInput = document.getElementById('search-input');
    const hskSelect = document.getElementById('hsk-select');

    async function fetchList() {
      try {
        const res = await fetch(API_URL);
        const json = await res.json();
        
        if (json.success && json.data.length > 0) {
          // Khóa chặt tên cột "Hán tự" theo đúng ảnh bạn gửi
          allVocab = json.data.filter(item => item['Hán tự']);
          
          if(allVocab.length === 0) {
            document.getElementById('loading').textContent = "Không tìm thấy dữ liệu ở cột 'Hán tự'.";
            return;
          }

          setupFilters();
          renderTable();
          document.getElementById('loading').style.display = 'none';
          document.getElementById('app-content').style.display = 'block';
        } else {
          document.getElementById('loading').textContent = "Không có dữ liệu trong trang tính.";
        }
      } catch (e) {
        document.getElementById('loading').textContent = "Lỗi mạng hoặc link API. Vui lòng tải lại trang.";
      }
    }

    function setupFilters() {
      // Nhận diện theo cột ID
      const hsks = [...new Set(allVocab.map(item => item['ID'] || 'Khác'))];
      hsks.forEach(hsk => {
        if(hsk) {
          const option = document.createElement('option');
          option.value = hsk;
          option.textContent = hsk;
          hskSelect.appendChild(option);
        }
      });

      searchInput.addEventListener('input', renderTable);
      hskSelect.addEventListener('change', renderTable);
    }

    function renderTable() {
      const keyword = searchInput.value.toLowerCase().trim();
      const hskFilter = hskSelect.value;

      const filtered = allVocab.filter(item => {
        // Cập nhật lấy chính xác dữ liệu theo 3 cột
        const hanzi = (item['Hán tự'] || '').toLowerCase();
        const pinyin = (item['PINYIN'] || '').toLowerCase();
        const meaning = (item['NGHIA'] || '').toLowerCase();
        const level = item['ID'] || 'Khác';

        const matchKeyword = hanzi.includes(keyword) || pinyin.includes(keyword) || meaning.includes(keyword);
        const matchHsk = hskFilter === 'all' || level === hskFilter;

        return matchKeyword && matchHsk;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; padding: 30px;">Không tìm thấy từ vựng nào.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(item => {
        const hanzi = item['Hán tự'] || '';
        const pinyin = item['PINYIN'] || '';
        const meaning = item['NGHIA'] || '';

        return `
          <tr>
            <td data-label="Hán Tự" class="hanzi-cell">
              ${hanzi}
              <button class="audio-btn" onclick="playAudio('${hanzi}')">🔊</button>
            </td>
            <td data-label="Pinyin" class="pinyin-cell">${pinyin}</td>
            <td data-label="Nghĩa">${meaning}</td>
          </tr>
        `;
      }).join('');
    }

    function playAudio(text) {
      if (!text) return;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN'; u.rate = 0.85;
        window.speechSynthesis.speak(u);
      }
    }

    fetchList();
  </script>
</body>
</html>
