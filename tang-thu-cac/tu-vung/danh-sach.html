<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh Sách Từ Vựng</title>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    :root {
      --ink: #2b2622; --brown-dark: #4a3525; --gold-earth: #b38b4d;
      --blue-water: #1e3a5f; --blue-light: #e6edf2;
      --paper: rgba(245, 238, 219, 0.95); --line: #d8c9ad;
    }

    html { background: transparent; }
    body {
      font-family: "Noto Serif", serif; background: transparent;
      margin: 0; padding: 20px 20px 60px; color: var(--ink);
    }
    .container { max-width: 900px; margin: 0 auto; }

    /* THANH TÌM KIẾM & BỘ LỌC */
    .top-controls {
      position: sticky; top: 0; z-index: 10;
      background: var(--paper);
      -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
      border: 1px solid var(--gold-earth); padding: 16px; border-radius: 16px;
      margin-bottom: 24px; display: flex; gap: 16px; align-items: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }
    .search-box { flex: 1; min-width: 0; }
    .search-box input {
      width: 100%; padding: 12px 20px; border-radius: 12px; border: 1px solid var(--line);
      font-family: inherit; font-size: 16px; outline: none; transition: 0.3s;
      background: #fdfbf7; color: var(--blue-water);
    }
    .search-box input:focus { border-color: var(--blue-water); box-shadow: 0 0 0 3px var(--blue-light); }

    .hsk-filter {
      padding: 12px 20px; border-radius: 12px; border: 1px solid var(--line);
      background: white; color: var(--blue-water); font-weight: 700; font-size: 16px;
      font-family: inherit; outline: none; cursor: pointer; max-width: 100%;
    }

    /* BẢNG TỪ VỰNG */
    .table-wrapper {
      background: var(--paper);
      border-radius: 16px;
      border: 1px solid var(--gold-earth);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th {
      background: var(--blue-water); color: white;
      padding: 18px 20px; font-weight: 600; font-size: 16px; letter-spacing: 1px;
    }
    td {
      padding: 16px 20px; border-bottom: 1px dashed var(--line);
      vertical-align: middle; color: var(--brown-dark); font-size: 16px;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.4); }

    /* Hán tự + nút loa nằm trong một khung riêng để <td> giữ nguyên là ô bảng */
    .hanzi-wrap {
      display: flex; align-items: center; gap: 15px;
      font-family: "Ma Shan Zheng", cursive; font-size: 42px; color: var(--ink); line-height: 1.1;
    }
    .pinyin-cell { font-weight: 700; color: var(--blue-water); font-family: sans-serif; font-size: 20px; }
    .empty-row { text-align: center; padding: 30px; }

    .audio-btn {
      background: white; border: 1px solid var(--blue-water); color: var(--blue-water);
      width: 38px; height: 38px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
      cursor: pointer; font-size: 18px; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      flex-shrink: 0;
    }
    .audio-btn:hover { background: var(--blue-water); color: white; transform: scale(1.1); }

    .status-msg { text-align: center; }
    #loading { color: #fff; font-size: 18px; margin-top: 50px; background: rgba(0,0,0,0.5); padding: 12px 25px; border-radius: 12px; display: inline-block; }

    /* ĐIỆN THOẠI: mỗi từ là một thẻ dọc, các dòng xếp chồng gọn gàng */
    @media (max-width: 700px) {
      body { padding: 12px 12px 40px; }
      .top-controls { flex-direction: column; align-items: stretch; gap: 10px; padding: 12px; }
      .hsk-filter { width: 100%; }

      table, tbody, tr, td { display: block; width: 100%; }
      thead { display: none; }

      tr { padding: 12px 6px; border-bottom: 1px dashed var(--line); }
      tr:last-child { border-bottom: none; }
      tr:hover td { background: transparent; }

      td { border: none; padding: 5px 14px; font-size: 16px; }
      td[data-label]::before {
        content: attr(data-label);
        display: block; margin-bottom: 2px;
        font-weight: 600; font-size: 12px; letter-spacing: 0.5px;
        color: var(--blue-water); opacity: 0.8;
      }
      /* Hán tự đã đủ rõ nên bỏ nhãn */
      td.hanzi-cell::before { display: none; }
      .hanzi-wrap { font-size: 38px; }
      .pinyin-cell { font-size: 18px; }
      .empty-row { padding: 24px 14px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="status-msg"><div id="loading">Đang tải danh sách từ vựng...</div></div>

    <div id="app-content" style="display: none;">
      <div class="top-controls">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="Nhập Hán tự, Pinyin hoặc Nghĩa để tìm kiếm..." autocomplete="off">
        </div>
        <select id="hsk-select" class="hsk-filter">
          <option value="all">Tất cả bài học</option>
        </select>
      </div>

      <div class="table-wrapper">
        <table id="vocab-table">
          <thead>
            <tr>
              <th>Hán Tự</th>
              <th>Pinyin</th>
              <th>Nghĩa Tiếng Việt</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Khi chạy trong khung, config.js của trang cha sẽ được dùng. Dòng dưới chỉ để mở trang này riêng lẻ
       (đường dẫn tính từ tang-thu-cac/tu-vung/ ra thư mục gốc). Sai đường dẫn cũng không sao. -->
  <script src="../../config.js"></script>
  <script>
    const CFG = (function () {
      if (window.cobiFetchSheet) return window;
      try { if (window.parent && window.parent.cobiFetchSheet) return window.parent; } catch (e) {}
      return null;
    })();

    let allVocab = [];
    const loadingEl = document.getElementById('loading');
    const tbody = document.getElementById('table-body');
    const searchInput = document.getElementById('search-input');
    const hskSelect = document.getElementById('hsk-select');

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function fetchList() {
      if (!CFG) { loadingEl.textContent = 'Không tìm thấy config.js. Hãy mở trang qua trang chủ của Thư Quán.'; return; }
      try {
        const rows = await CFG.cobiFetchSheet('getVocabHSK');
        allVocab = rows.map(r => ({
          level:   CFG.cobiPick(r, ['ID']) || 'Khác',
          hanzi:   CFG.cobiPick(r, ['Hán tự', 'HANTU', 'TUVUNG']),
          pinyin:  CFG.cobiPick(r, ['PINYIN']),
          meaning: CFG.cobiPick(r, ['NGHIA', 'Nghĩa'])
        })).filter(v => v.hanzi);

        if (allVocab.length === 0) { loadingEl.textContent = 'Không tìm thấy dữ liệu ở cột "Hán tự".'; return; }

        setupFilters();
        renderTable();
        loadingEl.style.display = 'none';
        document.getElementById('app-content').style.display = 'block';
      } catch (e) {
        loadingEl.textContent = e.message || 'Lỗi tải dữ liệu.';
      }
    }

    function setupFilters() {
      const levels = [...new Set(allVocab.map(v => v.level))]
        .sort((a, b) => a.localeCompare(b, 'vi', { numeric: true }));
      levels.forEach(level => {
        const option = document.createElement('option');
        option.value = level;
        option.textContent = level;
        hskSelect.appendChild(option);
      });
      searchInput.addEventListener('input', renderTable);
      hskSelect.addEventListener('change', renderTable);
    }

    function renderTable() {
      const keyword = searchInput.value.toLowerCase().trim();
      const levelFilter = hskSelect.value;

      const filtered = allVocab.filter(v => {
        const matchKeyword = !keyword ||
          v.hanzi.toLowerCase().includes(keyword) ||
          v.pinyin.toLowerCase().includes(keyword) ||
          v.meaning.toLowerCase().includes(keyword);
        const matchLevel = levelFilter === 'all' || v.level === levelFilter;
        return matchKeyword && matchLevel;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="empty-row">Không tìm thấy từ vựng nào.</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(v => `
        <tr>
          <td data-label="Hán Tự" class="hanzi-cell">
            <div class="hanzi-wrap">
              <span>${esc(v.hanzi)}</span>
              <button class="audio-btn" type="button" data-audio="${esc(v.hanzi)}" aria-label="Nghe phát âm">🔊</button>
            </div>
          </td>
          <td data-label="Pinyin" class="pinyin-cell">${esc(v.pinyin)}</td>
          <td data-label="Nghĩa">${esc(v.meaning)}</td>
        </tr>`).join('');
    }

    tbody.addEventListener('click', e => {
      const btn = e.target.closest('[data-audio]');
      if (btn) playAudio(btn.dataset.audio);
    });

    function playAudio(text) {
      if (!text || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-CN'; u.rate = 0.85;
      window.speechSynthesis.speak(u);
    }

    fetchList();
  </script>
</body>
</html>
