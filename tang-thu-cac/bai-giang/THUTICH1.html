ôi còn có một con chó, nó vừa ___ vừa ___. Tôi rất thích nó.']\n];\nvar MODELS=[\n ['Mẫu 1: bố mẹ và anh chị em',\n  '我家有五口人：爸爸、妈妈、一个弟弟、一个妹妹，还有我。我爸爸是律师，我妈妈不工作。我弟弟是大学生，我妹妹是中学生，她今年十二岁。我家还有一只狗，它又漂亮又可爱。我很喜欢它。',\n  'Wǒ jiā yǒu wǔ kǒu rén: bàba, māma, yí ge dìdi, yí ge mèimei, hái yǒu wǒ. Wǒ bàba shì lǜshī, wǒ māma bù gōngzuò. Wǒ dìdi shì dàxuéshēng, wǒ mèimei shì zhōngxuéshēng, tā jīnnián shí’èr suì. Wǒ jiā hái yǒu yì zhī gǒu, tā yòu piàoliang yòu kě’ài. Wǒ hěn xǐhuan tā.',\n  'Nhà tôi có năm người: bố, mẹ, một em trai, một em gái và tôi. Bố tôi là luật sư, mẹ tôi không đi làm. Em trai tôi là sinh viên đại học, em gái tôi là học sinh trung học, em ấy năm nay 12 tuổi. Nhà tôi còn có một con chó, nó vừa đẹp vừa dễ thương. Tôi rất thích nó.'],\n ['Mẫu 2: có chồng và con (từ mở rộng)',\n  '我家有四口人：丈夫、一个儿子、一个女儿，还有我。我丈夫是医生。我儿子今年八岁，我女儿今年五岁。我爸爸、妈妈在中国。',\n  'Wǒ jiā yǒu sì kǒu rén: zhàngfu, yí ge érzi, yí ge nǚ’ér, hái yǒu wǒ. Wǒ zhàngfu shì yīshēng. Wǒ érzi jīnnián bā suì, wǒ nǚ’ér jīnnián wǔ suì. Wǒ bàba, māma zài Zhōngguó.',\n  'Nhà tôi có bốn người: chồng, một con trai, một con gái và tôi. Chồng tôi là bác sĩ. Con trai tôi năm nay 8 tuổi, con gái tôi năm nay 5 tuổi. Bố mẹ tôi ở Trung Quốc.']\n];\nvar PHOTO=[\n ['这是我爸爸。','Zhè shì wǒ bàba.','Đây là bố tôi.'],\n ['他今年五十岁，是律师。','Tā jīnnián wǔshí suì, shì lǜshī.','Ông ấy năm nay 50 tuổi, là luật sư.'],\n ['这是我姐姐，她是医生。','Zhè shì wǒ jiějie, tā shì yīshēng.','Đây là chị tôi, chị ấy là bác sĩ.'],\n ['他是我姐姐的男朋友。','Tā shì wǒ jiějie de nánpéngyou.','Anh ấy là bạn trai của chị tôi.'],\n ['他们都在中国。','Tāmen dōu zài Zhōngguó.','Họ đều ở Trung Quốc.']\n];\nvar DLG=[\n ['Bài khóa 1','Hǎilún giới thiệu gia đình',[\n  ['Ōuwén 欧文','你家有几口人？','Nǐ jiā yǒu jǐ kǒu rén?','Nhà bạn có mấy người?'],\n  ['Hǎilún 海伦','我家有五口人，爸爸、妈妈、一个弟弟、一个妹妹，还有我。你看，这是他们的照片。','Wǒ jiā yǒu wǔ kǒu rén, bàba, māma, yí ge dìdi, yí ge mèimei, hái yǒu wǒ. Nǐ kàn, zhè shì tāmen de zhàopiàn.','Nhà mình có năm người: bố, mẹ, một em trai, một em gái và mình. Bạn xem này, đây là ảnh của họ.'],\n  ['Ōuwén 欧文','你爸爸、妈妈做什么工作？','Nǐ bàba, māma zuò shénme gōngzuò?','Bố mẹ bạn làm nghề gì?'],\n  ['Hǎilún 海伦','我爸爸是律师，我妈妈不工作。','Wǒ bàba shì lǜshī, wǒ māma bù gōngzuò.','Bố mình là luật sư, mẹ mình không đi làm.'],\n  ['Ōuwén 欧文','你弟弟和妹妹都是学生吗？','Nǐ dìdi hé mèimei dōu shì xuésheng ma?','Em trai và em gái bạn đều là học sinh à?'],\n  ['Hǎilún 海伦','对，我弟弟是大学生，我妹妹是中学生。','Duì, wǒ dìdi shì dàxuéshēng, wǒ mèimei shì zhōngxuéshēng.','Ừ, em trai mình là sinh viên đại học, em gái mình là học sinh trung học.'],\n  ['Ōuwén 欧文','你妹妹今年多大？','Nǐ mèimei jīnnián duō dà?','Em gái bạn năm nay bao nhiêu tuổi?'],\n  ['Hǎilún 海伦','十二岁。','Shí’èr suì.','12 tuổi.'],\n  ['Ōuwén 欧文','你的家人都在美国吗？','Nǐ de jiārén dōu zài Měiguó ma?','Người nhà bạn đều ở Mỹ à?'],\n  ['Hǎilún 海伦','对，他们都在美国。','Duì, tāmen dōu zài Měiguó.','Đúng, họ đều ở Mỹ.']]],\n ['Bài khóa 2','Mỹ Kinh và bức ảnh gia đình',[\n  ['Xiǎomíng 小明','美京，这是你家人的照片吗？','Měijīng, zhè shì nǐ jiārén de zhàopiàn ma?','Mỹ Kinh, đây là ảnh gia đình bạn à?'],\n  ['Měijīng 美京','是。','Shì.','Vâng.'],\n  ['Xiǎomíng 小明','他是谁？是你哥哥吗？','Tā shì shéi? Shì nǐ gēge ma?','Anh ấy là ai? Là anh trai bạn à?'],\n  ['Měijīng 美京','不是，他是我姐姐的男朋友。这是我的爸爸、妈妈，这是我哥哥、姐姐。','Bú shì, tā shì wǒ jiějie de nánpéngyou. Zhè shì wǒ de bàba, māma, zhè shì wǒ gēge, jiějie.','Không phải, anh ấy là bạn trai của chị mình. Đây là bố mẹ mình, đây là anh trai và chị gái mình.'],\n  ['Xiǎomíng 小明','你家还有一只狗？','Nǐ jiā háiyǒu yì zhī gǒu?','Nhà bạn còn có một con chó à?'],\n  ['Měijīng 美京','对，她是我妹妹。她又漂亮又可爱，我很喜欢她。','Duì, tā shì wǒ mèimei. Tā yòu piàoliang yòu kě’ài, wǒ hěn xǐhuan tā.','Đúng, nó là em gái mình. Nó vừa đẹp vừa dễ thương, mình rất thích nó. (Bài dùng 她 vì coi chú chó như em gái. Bình thường dùng 它 cho con vật.)'],\n  ['Xiǎomíng 小明','她多大？','Tā duō dà?','Nó mấy tuổi?'],\n  ['Měijīng 美京','她今年三岁。','Tā jīnnián sān suì.','Nó năm nay 3 tuổi.'],\n  ['Xiǎomíng 小明','你哥哥、姐姐做什么工作？','Nǐ gēge, jiějie zuò shénme gōngzuò?','Anh trai và chị gái bạn làm nghề gì?'],\n  ['Měijīng 美京','我哥哥是医生，姐姐是律师。','Wǒ gēge shì yīshēng, jiějie shì lǜshī.','Anh trai mình là bác sĩ, chị gái mình là luật sư.']]]\n];\nfunction buildPatterns(){\n  $('#subnav').innerHTML=[['sec-qa','Hỏi đáp'],['sec-gr','Ngữ pháp'],['sec-mw','Lượng từ'],['sec-intro','Giới thiệu'],['sec-dlg','Hội thoại']].map(function(s){return '\u003cbutton class=\"chip\" type=\"button\" data-go=\"'+s[0]+'\">'+s[1]+'\u003c/button>'}).join('');\n  $('#qaList').innerHTML=QA.map(function(g){return '\u003ch3 class=\"qh\">'+g[0]+'\u003c/h3>'+g[1].map(function(q){return '\u003cdiv class=\"qa\">\u003cdiv>\u003cspan class=\"lab\">Q\u003c/span>'+exInline(q[0])+'\u003c/div>\u003cdiv class=\"a\">\u003cspan class=\"lab\">A\u003c/span>'+exInline(q[1])+'\u003c/div>\u003c/div>'}).join('')}).join('');\n  $('#grList').innerHTML=GR.map(function(g){return '\u003cdetails class=\"gr\"'+(g.open?' open':'')+'>\u003csummary>\u003cspan class=\"t\">'+g.t+'\u003c/span>\u003cspan class=\"f\">'+g.f+'\u003c/span>\u003c/summary>\u003cdiv class=\"gb\">\u003cul>'+\n    g.n.map(function(x){return '\u003cli>'+x+'\u003c/li>'}).join('')+'\u003c/ul>'+g.e.map(ex).join('')+'\u003c/div>\u003c/details>'}).join('');\n  $('#mwBody').innerHTML=MW.map(function(m){return '\u003ctr>\u003ctd>\u003cspan class=\"big\">'+m[0]+'\u003c/span>\u003cdiv class=\"py\">'+m[1]+'\u003c/div>\u003c/td>\u003ctd>'+m[2]+'\u003c/td>\u003ctd class=\"zh\">'+m[3].split(' ')[0]+'\u003cdiv class=\"py\">'+m[3].split(' ').slice(1).join(' ')+'\u003c/div>\u003c/td>\u003c/tr>'}).join('');\n  $('#steps').innerHTML=STEPS.map(function(s){return '\u003cli>\u003cb>'+s[0]+'\u003c/b>\u003cdiv class=\"tpl\">'+s[1]+'\u003c/div>\u003cdiv class=\"py\">'+s[2]+'\u003c/div>\u003cdiv class=\"vi-t\" style=\"font-size:14px\">'+s[3]+'\u003c/div>\u003c/li>'}).join('');\n  $('#models').innerHTML=MODELS.map(function(m,i){return '\u003cdiv class=\"model\">\u003cdiv class=\"head\">\u003cb>'+m[0]+'\u003c/b>\u003cbutton class=\"btn\" type=\"button\" data-say=\"'+m[1]+'\">'+ICON+' Nghe\u003c/button>\u003c/div>\u003cdiv class=\"zh\">'+m[1]+'\u003c/div>\u003cdiv class=\"py\">'+m[2]+'\u003c/div>\u003cdiv class=\"vi-t\">'+m[3]+'\u003c/div>\u003c/div>'}).join('');\n  $('#photo').innerHTML='\u003cdiv class=\"model\">'+PHOTO.map(function(p){return ex(p)}).join('')+'\u003c/div>';\n  $('#dlgs').innerHTML=DLG.map(function(d,i){\n    return '\u003cdiv class=\"dlg\">\u003cdiv class=\"head\">\u003cdiv>\u003cb>'+d[0]+'\u003c/b>\u003cdiv class=\"muted\" style=\"font-size:13px\">'+d[1]+'\u003c/div>\u003c/div>\u003cbutton class=\"btn\" type=\"button\" data-all=\"'+i+'\">'+ICON+' Nghe cả bài\u003c/button>\u003c/div>'+\n    d[2].map(function(l){return '\u003cdiv class=\"line\">\u003cdiv class=\"spkr\">'+l[0].split(' ')[0]+'\u003cspan>'+l[0].split(' ')[1]+'\u003c/span>\u003c/div>\u003cdiv class=\"body\">\u003cdiv class=\"zh\">'+l[1]+'\u003c/div>\u003cdiv class=\"py\">'+l[2]+'\u003c/div>\u003cdiv class=\"vi-t\">'+l[3]+'\u003c/div>\u003c/div>'+spk(l[1])+'\u003c/div>'}).join('')+'\u003c/div>'}).join('');\n}\nfunction exInline(a){return '\u003cdiv class=\"ex\" style=\"margin-top:2px;display:inline-flex;vertical-align:top;width:calc(100% - 2em)\">'+spk(a[0])+'\u003cdiv>\u003cdiv class=\"zh\">'+a[0]+'\u003c/div>\u003cdiv class=\"py\">'+a[1]+'\u003c/div>\u003cdiv class=\"vi-t\">'+a[2]+'\u003c/div>\u003c/div>\u003c/div>'}\n\n/* ---------- toggles ---------- */\nfunction setFlag(cls,btn,on,key){document.body.classList.toggle(cls,on);btn.setAttribute('aria-pressed',on?'true':'false');ls.set(key,on?'1':'0')}\n\n/* ---------- tabs ---------- */\nvar TABS=['cay-gia-pha','tu-vung','mau-cau'];\nfunction show(id){\n  if(TABS.indexOf(id)\u003c0)id=TABS[0];\n  TABS.forEach(function(t){$('#t-'+t).setAttribute('aria-selected',t===id?'true':'false');$('#p-'+t).hidden=t!==id});\n  closeSheet();ls.set('tab',id);\n  var top=$('.bar').offsetTop;if(window.pageYOffset>top)window.scrollTo(0,top);\n}\n\n/* ---------- events ---------- */\ndocument.addEventListener('click',function(e){\n  var t=e.target;\n  var sp=t.closest('[data-say]');if(sp){e.stopPropagation();speakList([sp.dataset.say]);return}\n  var all=t.closest('[data-all]');if(all){speakList(DLG[+all.dataset.all][2].map(function(l){return l[1]}));return}\n  var pe=t.closest('.person');\n  if(pe){\n    var hide=document.body.classList.contains('quiz')||document.body.classList.contains('no-vi');\n    if(hide&&pe.dataset.id!=='me'&&!pe.classList.contains('on')){pe.classList.add('on');return}\n    if(selId===pe.dataset.id)closeSheet();else openSheet(pe.dataset.id);return}\n  var vt=t.closest('.vi-t');if(vt&&document.body.classList.contains('no-vi')){vt.classList.toggle('on')}\n  var vh=t.closest('.vhead');if(vh){var r=vh.parentNode;r.classList.toggle('open');vh.setAttribute('aria-expanded',r.classList.contains('open')?'true':'false');return}\n  var go=t.closest('[data-go]');if(go){var el=document.getElementById(go.dataset.go);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}\n  var ch=t.closest('[data-cat]');if(ch){cat=ch.dataset.cat;buildChips();drawVocab();return}\n  var tb=t.closest('[data-tab]');if(tb){location.hash=tb.dataset.tab;return}\n});\ndocument.addEventListener('keydown',function(e){\n  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&(e.target.classList.contains('vhead')||e.target.classList.contains('person'))){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}\n});\n$('#q').addEventListener('input',function(e){query=e.target.value;drawVocab()});\n$('#shX').addEventListener('click',closeSheet);\n$('#tgPy').addEventListener('click',function(){setFlag('no-py',this,!document.body.classList.contains('no-py'),'noPy')});\n$('#tgVi').addEventListener('click',function(){var on=!document.body.classList.contains('no-vi');setFlag('no-vi',this,on,'noVi');$$('.person.on').forEach(function(x){x.classList.remove('on')});$$('.vi-t.on').forEach(function(x){x.classList.remove('on')})});\n$('#tgQuiz').addEventListener('click',function(){var on=!document.body.classList.contains('quiz');setFlag('quiz',this,on,'quiz');$$('.person.on').forEach(function(x){x.classList.remove('on')});if(on)closeSheet()});\nwindow.addEventListener('hashchange',function(){show(location.hash.replace('#',''))});\n\n/* ---------- start ---------- */\nbuildTree();buildChips();drawVocab();buildPatterns();\nif(ls.get('noPy','0')==='1')setFlag('no-py',$('#tgPy'),true,'noPy');\nif(ls.get('noVi','0')==='1')setFlag('no-vi',$('#tgVi'),true,'noVi');\nshow(location.hash.replace('#','')||ls.get('tab','cay-gia-pha'));\n})();\n\u003c/script>\n\n\u003cstyle id=\"thu-tich-theme\">\nhtml,html body{background:transparent!important}\n:root:root[data-theme=\"light\"]{--bg:rgba(255,249,228,.9);--surface:rgba(255,253,243,.86);--ink:#08203c;--muted:#46566f;--line:rgba(15,44,79,.25);--seal:#14447a;--seal-soft:#fbeeb8}\n.mast{text-shadow:0 0 8px #fff,0 0 14px #fff}\n\u003c/style>\n\u003c/body>\u003c/html>"</script>

<script>
(function(){
  const lessons=[...document.querySelectorAll('template.lesson')];
  const $=id=>document.getElementById(id);
  const home=$('home'),reader=$('reader'),list=$('list'),q=$('q'),bg=$('bg');
  // bỏ dấu tiếng Việt + dấu thanh pinyin để tìm kiếm dễ hơn
  const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/gi,'d').toLowerCase().replace(/\s+/g,' ').trim();
  const source=t=>JSON.parse($(t.dataset.embed).textContent);
  const textOf=t=>{
    if(!t.dataset.embed)return t.content.textContent;
    const d=new DOMParser().parseFromString(source(t),'text/html');
    d.querySelectorAll('style').forEach(x=>x.remove());
    return d.documentElement.textContent;
  };
  const index=lessons.map(t=>norm([t.dataset.title,t.dataset.desc,t.dataset.tags,textOf(t)].join(' ')));
  const meta=lessons.map(t=>norm([t.dataset.title,t.dataset.desc,t.dataset.tags].join(' ')));
  const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text)e.textContent=text;return e};

  function render(){
    const words=norm(q.value).split(' ').filter(Boolean);
    list.textContent='';
    lessons.forEach((t,i)=>{
      if(!words.every(w=>meta[i].includes(w))&&!index[i].includes(words.join(' ')))return;
      const li=el('li'),a=el('a','card'),mid=el('span');
      a.href='#tt1/'+t.dataset.id;
      const h=el('h3',null,(i+1)+'. '+t.dataset.title),p=el('p',null,t.dataset.desc);
      mid.append(h,p);
      const seal=el('span','seal',t.dataset.han);seal.setAttribute('aria-hidden','true');
      a.append(seal,mid,el('span','arrow','➺'));
      li.append(a);list.append(li);
    });
    $('count').textContent=list.children.length+' bài';
    $('empty').hidden=list.children.length>0;
  }

  function route(){
    const id=location.hash.startsWith('#tt1/')?location.hash.slice(5):'';
    const t=lessons.find(x=>x.dataset.id===id);
    home.hidden=!!t;reader.hidden=!t;reader.textContent='';
    const embedded=!!(t&&t.dataset.embed);
    document.body.classList.toggle('embed',embedded);
    reader.classList.toggle('frame',!embedded);reader.classList.toggle('article',!embedded);
    if(embedded){
      const back=el('a','back','← Về mục lục');back.href='#tt1';
      const f=el('iframe','lesson-frame');f.title=t.dataset.title;f.srcdoc=source(t);
      reader.append(back,f);
      document.title=t.dataset.title+' · Thư Tịch I';
    }else if(t){
      const back=el('a','back','← Về mục lục');back.href='#tt1';
      const body=t.content.cloneNode(true);
      body.querySelectorAll('.say').forEach(x=>{x.type='button';x.title='Bấm để nghe'});
      const tools=el('div','tools');
      [['Mở tất cả',true],['Thu tất cả',false]].forEach(([label,open])=>{
        const btn=el('button',null,label);btn.type='button';
        btn.onclick=()=>{reader.querySelectorAll('.muc').forEach(d=>d.open=open);pan()};tools.append(btn);
      });
      reader.append(back,el('h2',null,t.dataset.title),tools,body);
      const back2=back.cloneNode(true);back2.style.marginTop='24px';reader.append(back2);
      document.title=t.dataset.title+' · Thư Tịch I';
    }else document.title='Thư Tịch I · Bí Kíp Công Lược';
    window.scrollTo(0,0);pan();
  }

  // ảnh nền trượt theo cuộn trang: đầu trang thấy mặt trời, cuối trang thấy con thuyền
  function pan(){
    const max=document.documentElement.scrollHeight-innerHeight;
    bg.style.backgroundPositionY=(max>0?Math.min(100,Math.max(0,scrollY/max*100)):0)+'%';
  }

  // đọc chữ Hán bằng giọng có sẵn của thiết bị
  function speak(text){
    if(!('speechSynthesis'in window))return;
    const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.75;
    const v=speechSynthesis.getVoices().find(v=>/^zh[-_]CN/i.test(v.lang));if(v)u.voice=v;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }

  reader.addEventListener('click',e=>{
    const pad=e.target.closest('.pad');
    if(pad){const ink=pad.querySelector('.ink');ink.style.animation='none';ink.getBoundingClientRect();ink.style.animation='';return}
    const b=e.target.closest('.say');if(b)speak(b.textContent);
  });

  reader.addEventListener('toggle',pan,true);
  q.addEventListener('input',()=>{render();pan()});
  addEventListener('hashchange',route);
  addEventListener('scroll',pan,{passive:true});
  addEventListener('resize',pan);
  render();route();
})();
</script>
<script>
/* Dải lụa voan đỏ mỏng bay nhẹ: nhiều sợi mảnh trong suốt, xoắn theo nhịp gió */
(function(){
  const c=document.getElementById('silk'),x=c.getContext('2d');
  const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let W,H;
  // y: độ cao (tỉ lệ màn hình), amp: độ uốn, w: bề rộng, a: độ đậm, p: pha
  const ribbons=[
    {y:.07,slope:.05,amp:26,w:34,a:1,p:0,sp:1},
    {y:.12,slope:-.04,amp:34,w:20,a:.7,p:2.4,sp:.75},
    {y:.88,slope:-.10,amp:40,w:38,a:.75,p:4.1,sp:.85}
  ];
  function size(){
    const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
    c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);if(still)draw(0);
  }
  function point(r,u,v,t){
    const k=Math.min(1,W/900)*.4+.6;
    const mid=r.y*H+r.slope*H*(u-.5)+Math.sin(u*7+r.p-t*r.sp)*r.amp*k+Math.sin(u*15+r.p*2-t*r.sp*1.6)*r.amp*.22*k;
    const half=r.w*k*Math.sin(u*9+r.p*1.7-t*r.sp*.8)*(.45+.55*Math.sin(Math.PI*u));
    return mid+half*v+Math.sin(u*12-t+v*1.5)*3*v;
  }
  function path(r,v,t,back){
    for(let i=0;i<=90;i++){
      const u=back?1-i/90:i/90, px=u*(W+80)-40, py=point(r,u,v,t);
      (i===0&&!back)?x.moveTo(px,py):x.lineTo(px,py);
    }
  }
  function draw(t){
    x.clearRect(0,0,W,H);
    ribbons.forEach(r=>{
      const g=x.createLinearGradient(0,0,W,0);
      [[0,0],[.12,1],[.38,.45],[.62,.95],[.88,.55],[1,0]].forEach(([s,o])=>g.addColorStop(s,`rgba(196,28,44,${o*r.a})`));
      x.fillStyle=g;x.strokeStyle=g;
      // lớp voan xuyên thấu
      [[-1,1,.17],[-1,.2,.1],[-.25,.7,.1]].forEach(([v1,v2,o])=>{
        x.globalAlpha=o;x.beginPath();path(r,v1,t);path(r,v2,t,true);x.closePath();x.fill();
      });
      // sợi tơ mảnh
      for(let n=0;n<=8;n++){
        const v=-1+n/4;x.globalAlpha=Math.abs(v)===1?.55:.2;x.lineWidth=Math.abs(v)===1?.9:.5;
        x.beginPath();path(r,v,t);x.stroke();
      }
    });
    x.globalAlpha=1;
  }
  function loop(ms){draw(ms/1400);requestAnimationFrame(loop)}
  addEventListener('resize',size);size();
  if(!still)requestAnimationFrame(loop);
})();
</script>
