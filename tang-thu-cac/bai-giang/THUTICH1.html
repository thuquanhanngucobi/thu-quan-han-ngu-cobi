#silk{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}

/* ===== Đèn lồng: gắn ở đầu trang, cuộn đi cùng trang nên không che chữ ===== */
.lantern{position:absolute;top:0;z-index:4;pointer-events:none;width:100px;transform-origin:top center;animation:swing 6s ease-in-out infinite alternate}
.lantern.l{left:3%}
.lantern.r{right:3%;animation-delay:-3s}
.lantern svg{display:block;width:100%;height:auto;overflow:visible}
.tassel{transform-box:fill-box;transform-origin:top center;animation:sway 3.6s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
@keyframes sway{from{transform:rotate(-3.5deg)}to{transform:rotate(3.5deg)}}

.wrap{max-width:860px;margin:0 auto;padding:64px 20px 60px}
header{text-align:center;margin-bottom:24px}
.eyebrow{display:inline-block;color:var(--navy);border-block:1px solid var(--gold);padding:0 18px;font-size:.88rem;letter-spacing:.08em;background:rgba(255,255,255,.45)}
h1{font-family:var(--title);font-size:clamp(2.6rem,8.5vw,4.3rem);color:var(--navy);line-height:1.4;text-shadow:0 0 12px #fff,0 0 26px #fff}
.sub-han{font-family:"Ma Shan Zheng",var(--han);font-size:1.5rem;color:var(--blue);letter-spacing:.5em;padding-left:.5em;text-shadow:0 0 10px #fff}

/* ===== Khung trong suốt ===== */
.frame{background:rgba(255,252,238,.38);backdrop-filter:blur(1.5px);border:1px solid rgba(15,44,79,.55);outline:1px solid rgba(201,162,75,.8);outline-offset:4px;border-radius:14px;box-shadow:0 12px 30px rgba(8,28,54,.14);text-shadow:0 0 4px #fff,0 0 8px rgba(255,255,255,.8)}

/* ===== Tìm kiếm ===== */
.search{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--blue);border-radius:40px;padding:4px 20px;margin:0 auto 26px;max-width:580px;box-shadow:0 6px 16px rgba(15,44,79,.14)}
.search svg{flex:none;width:20px;height:20px;stroke:var(--blue)}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--ink);font:inherit;padding:8px 0}
.search input::placeholder{color:#6b7f96}
.search:focus-within{box-shadow:0 0 0 4px rgba(29,78,128,.25)}

/* ===== Danh sách bài ===== */
.list-box{padding:22px}
.list-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--gold);padding-bottom:6px;margin-bottom:16px}
.list-head h2{font-family:var(--title);font-size:1.8rem;color:var(--navy)}
#count{font-size:.85rem;color:var(--blue)}
.list{list-style:none;display:grid;gap:14px}
.card{display:grid;grid-template-columns:62px 1fr auto;gap:18px;align-items:center;text-decoration:none;color:inherit;background:rgba(255,253,242,.45);border:1px solid rgba(15,44,79,.4);border-radius:12px;padding:12px 18px 12px 12px;transition:transform .2s,background .2s}
.card:hover,.card:focus-visible{transform:translateY(-3px);background:rgba(251,238,184,.82);outline:2px solid var(--blue)}
.seal{height:62px;display:grid;place-items:center;background:var(--navy);color:var(--gold-pale);text-shadow:none;font-family:"Ma Shan Zheng",var(--han);font-size:2.1rem;border-radius:50%;box-shadow:inset 0 0 0 3px var(--navy),inset 0 0 0 4px var(--gold)}
.card h3{font-size:1.1rem;line-height:1.5;color:var(--navy)}
.card p{font-size:.9rem}
.arrow{font-size:1.4rem;color:var(--blue)}
.empty{text-align:center;padding:28px 10px;font-style:italic}

/* ===== Bài viết + mục xổ/thu ===== */
.article{padding:24px 26px 30px}
.back{display:inline-block;background:var(--navy);color:var(--gold-pale);text-shadow:none;text-decoration:none;border:1px solid var(--gold);border-radius:30px;padding:5px 18px;font-size:.88rem}
.back:hover{background:var(--blue)}
.article>h2{font-family:var(--title);font-size:clamp(1.9rem,6vw,2.6rem);color:var(--navy);text-align:center;margin:14px 0 2px;line-height:1.5}
.tools{display:flex;justify-content:flex-end;gap:8px;margin:10px 0}
.tools button{font:inherit;font-size:.8rem;background:#fff;color:var(--blue);border:1px solid var(--blue);border-radius:20px;padding:1px 14px;cursor:pointer;text-shadow:none}
.muc{border:1px solid rgba(15,44,79,.4);border-radius:12px;margin-bottom:10px;background:rgba(255,253,242,.25)}
.muc>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 16px;font-weight:700;color:var(--navy);background:rgba(251,238,184,.62);border-radius:11px}
.muc>summary::-webkit-details-marker{display:none}
.muc>summary::after{content:"＋";flex:none;width:28px;height:28px;line-height:28px;text-align:center;border-radius:50%;background:var(--navy);color:var(--gold-pale);text-shadow:none}
.muc[open]>summary{background:rgba(15,44,79,.8);color:var(--gold-pale);text-shadow:none;border-radius:11px 11px 0 0}
.muc[open]>summary::after{content:"－";background:var(--gold-pale);color:var(--navy)}
.muc>summary:focus-visible{outline:3px solid var(--blue)}
.body{padding:10px 16px 16px}
.article h4{color:var(--blue);margin:16px 0 6px}
.article p{margin:8px 0}
.article ul{padding-left:22px;margin:8px 0}
.table-wrap{overflow-x:auto;margin:10px 0}
table{width:100%;border-collapse:collapse;background:rgba(255,253,244,.28);font-size:.94rem}
th,td{border:1px solid rgba(15,44,79,.45);padding:7px 10px;text-align:left;vertical-align:top}
th{background:rgba(15,44,79,.8);color:var(--gold-pale);text-shadow:none}
tbody th{background:rgba(251,238,184,.65);color:var(--navy)}
.py{font-weight:700;color:var(--navy);font-size:1.08em}
.zh{font-family:var(--han);font-size:1.15em}
.say{font-family:var(--han);font-size:1.2em;background:none;border:0;border-bottom:1px dashed var(--blue);color:var(--navy);cursor:pointer;padding:0 2px;text-shadow:inherit}
.say:hover{background:var(--gold-pale)}
.note{border:1px dashed var(--blue);background:rgba(251,238,184,.4);border-radius:10px;padding:8px 14px;margin:12px 0}

/* ===== Sơ đồ ===== */
.node{background:rgba(251,238,184,.75);border:1px solid var(--navy);border-radius:10px;padding:6px 12px;text-align:center;color:var(--navy);line-height:1.6}
.node.main{background:rgba(15,44,79,.9);color:var(--gold-pale);text-shadow:none;font-weight:700}
.tree{text-align:center}
.tree>.node{display:inline-block;min-width:220px;font-size:1.15rem}
.tree ul{display:flex;justify-content:center;list-style:none;padding:20px 0 0;margin:0;position:relative}
.tree>ul::before,.tree ul ul::before{content:"";position:absolute;top:0;left:50%;height:10px;border-left:2px solid var(--blue)}
.tree li{flex:1;position:relative;padding:10px 4px 0;min-width:0}
.tree li::before{content:"";position:absolute;top:-10px;left:0;right:0;border-top:2px solid var(--blue)}
.tree li:first-child::before{left:50%}.tree li:last-child::before{right:50%}
.tree li::after{content:"";position:absolute;top:-10px;left:50%;height:20px;border-left:2px solid var(--blue)}
.tree .leaf{height:100%;font-size:.92rem;padding:8px 4px}
.sylla{text-align:center;margin:6px 0 14px}
.circle{display:inline-grid;place-content:center;width:150px;height:150px;border-radius:50%;background:rgba(251,238,184,.82);border:1px solid var(--gold);font-weight:700;color:var(--navy);line-height:1.5;font-size:1.2rem}
.eq{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.eq .plus{font-size:2.2rem;color:var(--navy)}
.cap{display:block;text-align:center;font-weight:700;color:var(--navy);text-transform:uppercase;margin-top:6px}
.hello{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 14px;align-items:center;text-align:center}
.hello .big{font-size:2.4rem;font-weight:700;color:var(--blue);line-height:1.5}
.hello .char{font-family:var(--han);font-size:3.6rem;line-height:1.4}
.hao{display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:". top ." "left mid right" ". bot .";gap:6px 10px;align-items:center;text-align:center}
.side{display:flex;align-items:center;gap:8px}.side>div{flex:1}
.arr{font-size:1.5rem;color:var(--blue);line-height:1.2}

/* ===== Nét chữ ===== */
.strokes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.stroke{border:1px solid rgba(15,44,79,.4);border-radius:10px;background:rgba(255,253,244,.4);text-align:center;padding:10px 6px;line-height:1.6;font-size:.86rem}
.stroke svg{width:74px;height:74px;background:rgba(255,255,255,.6);border:1px solid var(--gold)}
.stroke .grid{stroke:var(--gold);stroke-width:.7;stroke-dasharray:4 4;fill:none}
.stroke .ink{stroke:var(--navy);stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.stroke b{display:block;color:var(--navy);font-size:.95rem}

footer{width:fit-content;max-width:100%;text-align:center;margin:30px auto 0;padding:4px 24px;border-radius:30px;background:rgba(15,44,79,.78);font-family:var(--title);font-size:1.1rem;color:var(--gold-pale)}
footer span{display:inline-block}
.part{text-align:center;font-size:1.05rem;border-bottom:1px solid var(--gold);padding-bottom:4px}
.divider{height:26px}
/* nét chữ chạy mô phỏng */
.pad{display:block;margin:0 auto 2px;background:none;border:0;cursor:pointer;color:var(--blue);font:inherit}
.pad svg{display:block;margin:auto}
.pad small{font-size:.7rem}
.stroke .ghost{stroke:rgba(15,44,79,.14);stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.stroke .ink{stroke-dasharray:1 2;animation:draw 1.6s ease-in-out .3s both}
@keyframes draw{from{stroke-dashoffset:1;opacity:0}3%{opacity:1}to{stroke-dashoffset:0;opacity:1}}
/* ===== Bài ghép (Số đếm, Phương tiện, Gia đình) ===== */
body.embed .lantern{display:none}
body.embed .wrap{max-width:1020px;padding:10px 10px 8px;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:8px}
body.embed #reader{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
body.embed .back{align-self:flex-start}
.lesson-frame{flex:1;width:100%;min-height:0;border:1px solid rgba(15,44,79,.55);outline:1px solid rgba(201,162,75,.8);outline-offset:2px;border-radius:14px;background:rgba(255,252,238,.52);color-scheme:light}
body.embed footer{margin:0 auto;font-size:.95rem;flex:none}
[hidden]{display:none!important}

@media (max-width:1139px){
  .lantern{width:64px}.lantern.l{left:8px}.lantern.r{right:8px}
  .wrap{padding-top:156px}
}
@media (max-width:640px){
  .wrap{padding:136px 12px 40px}
  .lantern{width:56px}
  .list-box{padding:14px 10px}
  .card{grid-template-columns:50px 1fr;gap:12px;padding:10px}
  .seal{height:50px;font-size:1.7rem}.arrow{display:none}
  .article{padding:16px 10px 22px}.body{padding:8px 8px 12px}
  th,td{padding:5px 5px;font-size:.84rem}
  .eq{grid-template-columns:1fr}.eq .plus{line-height:1}
  .hello{grid-template-columns:1fr}.hello .arr{display:none}
  .hao{grid-template-columns:1fr;grid-template-areas:"mid" "left" "right" "top" "bot"}.hao .arr{display:none}
  .tree>ul{flex-direction:column;gap:8px}.tree>ul::before,.tree>ul>li::before,.tree>ul>li::after{display:none}
  .tree .leaf{font-size:.8rem;overflow-wrap:break-word}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

    <tbody>
      <tr><td>1</td><td class="py">mā</td><td>Cao và đều, gần thanh ngang nhưng cao hơn</td><td><button class="say">妈</button> mẹ</td></tr>
      <tr><td>2</td><td class="py">má</td><td>Đi lên, gần thanh sắc</td><td><button class="say">麻</button> cây gai, tê</td></tr>
      <tr><td>3</td><td class="py">mǎ</td><td>Xuống thấp rồi lên, hơi giống thanh hỏi</td><td><button class="say">马</button> ngựa</td></tr>

      <tr><td>Nhẹ</td><td class="py">ma</td><td>Ngắn, nhẹ, không đánh dấu</td><td><button class="say">吗</button> trợ từ hỏi</td></tr>
    </tbody>
  </table></div>

  <details class="muc"><summary><span>变调 Quy tắc biến điệu</span></summary><div class="body">
  <p>Khi biến điệu, cách <b>đọc</b> thay đổi. Giáo trình có thể ghi thanh gốc hoặc thanh đã biến (nhất là với <span class="zh">一</span> và <span class="zh">不</span>).</p>
  <h4>Thanh 3</h4>
  <ul>
    <li>Thanh 3 + thanh 3: âm trước đọc thành thanh 2. <button class="say">你好</button> viết <span class="py">nǐ hǎo</span>, đọc <span class="py">ní hǎo</span>.</li>
    <li>Thanh 3 đứng trước thanh 1, 2, 4 và phần lớn thanh nhẹ: chỉ đọc nửa đầu (xuống thấp, không lên lại). Ví dụ <button class="say">很高</button> hěn gāo.</li>
  </ul>
  <h4>Chữ <span class="zh">不</span> (bù)</h4>
  <ul><li>Trước thanh 4, đọc thành <span class="py">bú</span>: <button class="say">不是</button> bú shì.</li></ul>
  <h4>Chữ <span class="zh">一</span> (yī)</h4>
  <ul>
    <li>Trước thanh 4, đọc <span class="py">yí</span>: <button class="say">一样</button> yíyàng.</li>
    <li>Trước thanh 1, 2, 3, đọc <span class="py">yì</span>: <button class="say">一天</button> yì tiān, <button class="say">一年</button> yì nián, <button class="say">一起</button> yìqǐ.</li>
    <li>Khi đứng một mình, đứng cuối từ hoặc chỉ số thứ tự, giữ <span class="py">yī</span>: <button class="say">第一</button> dì-yī.</li>
  </ul>
  </div></details>
  <details class="muc"><summary><span>拼写规则 Quy tắc viết Pinyin</span></summary><div class="body">
  <h4>Vị trí dấu thanh</h4>
  <ul>
    <li>Có <b>a</b> thì đánh dấu trên a: <span class="py">hǎo</span>.</li>
    <li>Không có a thì đánh trên <b>o</b> hoặc <b>e</b>: <span class="py">duō</span>, <span class="py">xiè</span>.</li>
    <li>Với <b>iu</b> và <b>ui</b>, đánh trên chữ đứng sau: <span class="py">liù</span>, <span class="py">duì</span>.</li>
    <li>Các trường hợp còn lại, đánh trên nguyên âm duy nhất. Dấu thay cho dấu chấm của i: <span class="py">nǐ</span>.</li>
  </ul>
  <h4>Viết y, w và ü</h4>
  <ul>
    <li>Nhóm i không có thanh mẫu: ia → <b>ya</b>, ie → <b>ye</b>, iou → <b>you</b>; riêng i, in, ing → <b>yi, yin, ying</b>.</li>
    <li>Nhóm u không có thanh mẫu: ua → <b>wa</b>, uo → <b>wo</b>, uei → <b>wei</b>; riêng u → <b>wu</b>.</li>
    <li>Nhóm ü không có thanh mẫu: ü, üe, üan, ün → <b>yu, yue, yuan, yun</b>.</li>
    <li>Sau <b>j, q, x</b>, chữ ü bỏ hai chấm: <span class="py">ju, qu, xu</span> (vẫn đọc là ü).</li>
    <li>Sau <b>n, l</b>, giữ hai chấm khi đọc là ü: <span class="py">nǚ</span> (<span class="zh">女</span>), <span class="py">lǜ</span> (<span class="zh">绿</span>).</li>
    <li>Có thanh mẫu đứng trước: iou, uei, uen viết gọn thành <b>iu, ui, un</b>.</li>
  </ul>
  <h4>Dấu cách âm</h4>
  <p>Âm tiết bắt đầu bằng a, o, e đứng sau âm tiết khác trong cùng một từ thì thêm dấu <b>’</b>: <span class="py">Xī’ān</span> (<span class="zh">西安</span>, Tây An).</p>
  </div></details>
</template>

  <details class="muc"><summary><span>笔顺 7 quy tắc bút thuận</span></summary><div class="body">
<div class="table-wrap"><table><thead><tr><th>STT</th><th>Quy tắc</th><th>Tiếng Trung</th><th>Ví dụ</th><th>Thứ tự viết</th></tr></thead><tbody><tr><td>1</td><td><b>Ngang trước, sổ sau</b></td><td><span class="zh">先横后竖</span></td><td><button class="say">十</button></td><td>ngang → sổ</td></tr><tr><td>2</td><td><b>Phẩy trước, mác sau</b></td><td><span class="zh">先撇后捺</span></td><td><button class="say">人</button></td><td>phẩy → mác</td></tr><tr><td>3</td><td><b>Trên trước, dưới sau</b></td><td><span class="zh">从上到下</span></td><td><button class="say">三</button></td><td>ngang trên → ngang giữa → ngang dưới</td></tr><tr><td>4</td><td><b>Trái trước, phải sau</b></td><td><span class="zh">从左到右</span></td><td><button class="say">川</button></td><td>nét trái → nét giữa → nét phải</td></tr><tr><td>5</td><td><b>Ngoài trước, trong sau</b></td><td><span class="zh">从外到内</span></td><td><button class="say">月</button></td><td>khung ngoài → hai nét ngang bên trong</td></tr><tr><td>6</td><td><b>Vào trước, đóng sau</b></td><td><span class="zh">先里头后封口</span></td><td><button class="say">日</button></td><td>sổ → ngang gập → ngang giữa → ngang đóng đáy</td></tr><tr><td>7</td><td><b>Giữa trước, hai bên sau</b></td><td><span class="zh">先中间后两边</span></td><td><button class="say">小</button></td><td>sổ móc → chấm trái → chấm phải</td></tr></tbody></table></div><div class="note">Một chữ thường phải kết hợp nhiều quy tắc.</div>
  </div></details>
  <details class="muc"><summary><span>补充规则 Quy tắc bổ sung</span></summary><div class="body">
<h4>Vị trí nét chấm</h4><ul><li>Chấm ở trên cùng hoặc phía trên bên trái viết <b>trước</b>: <button class="say">主</button> <button class="say">门</button></li><li>Chấm ở phía trên bên phải hoặc bên trong viết <b>sau</b>: <button class="say">我</button> <button class="say">书</button></li></ul>
<h4>Chữ có khung bao</h4><div class="table-wrap"><table><thead><tr><th>Kiểu khung</th><th>Thứ tự</th><th>Ví dụ</th></tr></thead><tbody><tr><td>Bao trên - trái, trên - phải</td><td>Ngoài trước, trong sau</td><td><button class="say">厅</button> <button class="say">句</button></td></tr><tr><td>Bao trái - dưới (<span class="zh">辶、廴</span>)</td><td>Trong trước, ngoài sau</td><td><button class="say">这</button> <button class="say">建</button></td></tr><tr><td>Hở phía trên (<span class="zh">凵</span>)</td><td>Trong trước, ngoài sau</td><td><button class="say">凶</button></td></tr><tr><td>Hở bên phải (<span class="zh">匚</span>)</td><td>Ngang trên → phần trong → sổ gập</td><td><button class="say">区</button></td></tr></tbody></table></div><p>Một số chữ có bộ bao trái - dưới như <button class="say">起</button> (bộ <span class="zh">走</span>) lại viết phần ngoài trước.</p>
  </div></details>

  <details class="muc"><summary><span>Mẹo tập viết</span></summary><div class="body">
<ul><li>Dùng vở ô <span class="zh">田字格</span> (ô chữ điền) hoặc <span class="zh">米字格</span> (ô chữ mễ) để canh vị trí các nét.</li><li>Mỗi chữ nằm cân đối trong một ô vuông, các chữ có kích thước đều nhau.</li><li>Vừa viết vừa đọc tên nét và đọc âm của chữ.</li></ul>

<template class="lesson" data-id="dai-tu-nhan-xung" data-title="Đại từ nhân xưng trong tiếng Trung" data-han="称"
  data-desc="Ngôi thứ nhất, hai, ba; số nhiều, chào hỏi và xưng hô cổ trang." data-tags="chào hỏi tạm biệt xưng hô ngôi tôi bạn anh ấy cô ấy">
  <p><b>Đại từ nhân xưng</b> (<span class="zh">人称代词</span> rénchēng dàicí) dùng để chỉ người nói, người nghe hoặc người/vật được nhắc tới. Tiếng Trung hiện đại đơn giản hơn tiếng Việt: thường không đổi từ xưng hô theo tuổi hay vai vế.</p>

  <details class="muc"><summary><span>1. Bảng cơ bản</span></summary><div class="body">
  <div class="table-wrap"><table>
    <thead><tr><th>Ngôi</th><th>Số ít</th><th>Số nhiều</th></tr></thead>
    <tbody>
      <tr><td>Thứ nhất</td><td><button class="say">我</button> wǒ<br>tôi, ta, mình</td><td><button class="say">我们</button> wǒmen<br><button class="say">咱们</button> zánmen<br>chúng tôi, chúng ta</td></tr>
      <tr><td>Thứ hai</td><td><button class="say">你</button> nǐ (bạn)<br><button class="say">您</button> nín (ngài, kính trọng)</td><td><button class="say">你们</button> nǐmen<br>các bạn</td></tr>
      <tr><td>Thứ ba<br>(nam / chung)</td><td><button class="say">他</button> tā<br>anh ấy, ông ấy</td><td><button class="say">他们</button> tāmen<br>họ (nam hoặc cả nam lẫn nữ)</td></tr>
      <tr><td>Thứ ba (nữ)</td><td><button class="say">她</button> tā<br>cô ấy, bà ấy</td><td><button class="say">她们</button> tāmen<br>họ (toàn nữ)</td></tr>
      <tr><td>Thứ ba<br>(vật, con vật)</td><td><button class="say">它</button> tā<br>nó</td><td><button class="say">它们</button> tāmen<br>chúng nó</td></tr>
    </tbody>
  </table></div>
  <div class="note"><span class="zh">他、她、它</span> đều đọc là <span class="py">tā</span>. Khi nghe, phải dựa vào ngữ cảnh. Khi viết, chọn đúng chữ.</div>
  </div></details>
  <details class="muc"><summary><span>2. Những điểm cần nhớ</span></summary><div class="body">
  <h4><span class="zh">我们</span> và <span class="zh">咱们</span></h4>
  <ul>
    <li><span class="zh">咱们</span>: <b>bao gồm</b> người nghe. <button class="say">咱们走吧。</button> Zánmen zǒu ba. (Chúng ta đi thôi.)</li>
    <li><span class="zh">我们</span>: <b>có thể có hoặc không</b> bao gồm người nghe. <button class="say">我们先走了，你慢慢吃。</button> Wǒmen xiān zǒu le, nǐ mànmàn chī. (Chúng tôi đi trước, bạn cứ ăn từ từ.)</li>
    <li><span class="zh">咱们</span> hay gặp trong khẩu ngữ, nhất là ở miền Bắc Trung Quốc.</li>
  </ul>
  <h4><span class="zh">您</span>: cách nói lịch sự</h4>
  <p>Dùng với người lớn tuổi, thầy cô, khách hàng, cấp trên. <button class="say">您好！</button> Nín hǎo! Với nhiều người, thường nói <button class="say">各位</button> gèwèi (quý vị) hoặc <span class="zh">您两位</span> nín liǎng wèi (hai vị), ít nói <span class="zh">您们</span>.</p>
  <h4>Hậu tố <span class="zh">们</span> (men)</h4>
  <p>Tạo số nhiều cho đại từ và danh từ chỉ người. Không dùng khi đã có số lượng cụ thể: nói <span class="zh">三个学生</span> (ba học sinh), <b>không</b> nói <span class="zh">三个学生们</span>.</p>
  </div></details>
  <details class="muc"><summary><span>3. Đại từ liên quan thường gặp</span></summary><div class="body">
  <div class="table-wrap"><table>
    <thead><tr><th>Từ</th><th>Pinyin</th><th>Nghĩa</th></tr></thead>
    <tbody>
      <tr><td><button class="say">大家</button></td><td>dàjiā</td><td>mọi người</td></tr>
      <tr><td><button class="say">自己</button></td><td>zìjǐ</td><td>bản thân, tự mình</td></tr>
      <tr><td><button class="say">别人</button></td><td>biéren</td><td>người khác</td></tr>
    </tbody>
  </table></div>
  </div></details>
  <details class="muc"><summary><span>4. Mở rộng: xưng hô cổ trang</span></summary><div class="body">
  <p>Hay gặp trong văn cổ, tiểu thuyết và phim cổ trang. Nhiều từ không phải đại từ theo nghĩa chặt mà là cách <b>tự xưng, tôn xưng</b>. Không dùng trong giao tiếp thường ngày.</p>
  <div class="table-wrap"><table>
    <thead><tr><th>Từ</th><th>Pinyin</th><th>Hán Việt</th><th>Cách dùng</th></tr></thead>
    <tbody>
      <tr><td><button class="say">吾</button></td><td>wú</td><td>ngô</td><td>ta (văn ngôn)</td></tr>
      <tr><td><button class="say">汝</button></td><td>rǔ</td><td>nhữ</td><td>ngươi (văn ngôn)</td></tr>
      <tr><td><button class="say">君</button></td><td>jūn</td><td>quân</td><td>chàng, ngài (gọi người đối diện)</td></tr>
      <tr><td><button class="say">在下</button></td><td>zàixià</td><td>tại hạ</td><td>tự xưng khiêm nhường</td></tr>
      <tr><td><button class="say">阁下</button></td><td>géxià</td><td>các hạ</td><td>tôn xưng người đối diện</td></tr>
      <tr><td><button class="say">朕</button></td><td>zhèn</td><td>trẫm</td><td>hoàng đế tự xưng (từ thời Tần)</td></tr>
      <tr><td><button class="say">本宫</button></td><td>běngōng</td><td>bản cung</td><td>hậu, phi có địa vị tự xưng (thường thấy trên phim)</td></tr>
      <tr><td><button class="say">臣妾</button></td><td>chénqiè</td><td>thần thiếp</td><td>hậu, phi tự xưng với vua (thường thấy trên phim)</td></tr>
      <tr><td><button class="say">微臣</button></td><td>wēichén</td><td>vi thần</td><td>quan tự xưng khiêm nhường với vua</td></tr>
      <tr><td><button class="say">奴婢</button></td><td>núbì</td><td>nô tỳ</td><td>người hầu tự xưng</td></tr>
    </tbody>
  </table></div>
  </div></details>
  <details class="muc"><summary><span>5. 问候 Chào hỏi</span></summary><div class="body">
<h4>Chào khi gặp mặt</h4><div class="table-wrap"><table><thead><tr><th>Câu chào</th><th>Pinyin</th><th>Nghĩa / cách dùng</th></tr></thead><tbody><tr><td><button class="say">你好！</button></td><td>Nǐ hǎo!</td><td>Xin chào!</td></tr><tr><td><button class="say">您好！</button></td><td>Nín hǎo!</td><td>Kính chào ông/bà, thầy/cô</td></tr><tr><td><button class="say">你们好！</button></td><td>Nǐmen hǎo!</td><td>Chào các bạn</td></tr><tr><td><button class="say">大家好！</button></td><td>Dàjiā hǎo!</td><td>Chào mọi người</td></tr><tr><td><button class="say">老师好！</button></td><td>Lǎoshī hǎo!</td><td>Em chào thầy/cô</td></tr></tbody></table></div><h4>Chào theo thời gian</h4><div class="table-wrap"><table><thead><tr><th>Câu chào</th><th>Pinyin</th><th>Nghĩa / cách dùng</th></tr></thead><tbody><tr><td><button class="say">早上好！</button></td><td>Zǎoshang hǎo!</td><td>Chào buổi sáng (sáng sớm)</td></tr><tr><td><button class="say">上午好！</button></td><td>Shàngwǔ hǎo!</td><td>Chào buổi sáng (trước trưa)</td></tr><tr><td><button class="say">中午好！</button></td><td>Zhōngwǔ hǎo!</td><td>Chào buổi trưa</td></tr><tr><td><button class="say">下午好！</button></td><td>Xiàwǔ hǎo!</td><td>Chào buổi chiều</td></tr><tr><td><button class="say">晚上好！</button></td><td>Wǎnshang hǎo!</td><td>Chào buổi tối</td></tr><tr><td><button class="say">晚安！</button></td><td>Wǎn’ān!</td><td>Chúc ngủ ngon</td></tr></tbody></table></div><h4>Hỏi thăm, làm quen</h4><div class="table-wrap"><table><thead><tr><th>Câu chào</th><th>Pinyin</th><th>Nghĩa / cách dùng</th></tr></thead><tbody><tr><td><button class="say">你好吗？</button></td><td>Nǐ hǎo ma?</td><td>Bạn khỏe không?</td></tr><tr><td><button class="say">我很好，谢谢。你呢？</button></td><td>Wǒ hěn hǎo, xièxie. Nǐ ne?</td><td>Tôi khỏe, cảm ơn. Còn bạn?</td></tr><tr><td><button class="say">好久不见！</button></td><td>Hǎojiǔ bú jiàn!</td><td>Lâu rồi không gặp!</td></tr><tr><td><button class="say">很高兴认识你。</button></td><td>Hěn gāoxìng rènshi nǐ.</td><td>Rất vui được làm quen với bạn</td></tr></tbody></table></div><h4>Tạm biệt</h4><div class="table-wrap"><table><thead><tr><th>Câu chào</th><th>Pinyin</th><th>Nghĩa / cách dùng</th></tr></thead><tbody><tr><td><button class="say">再见！</button></td><td>Zàijiàn!</td><td>Tạm biệt!</td></tr><tr><td><button class="say">明天见！</button></td><td>Míngtiān jiàn!</td><td>Hẹn mai gặp!</td></tr><tr><td><button class="say">拜拜！</button></td><td>Báibái!</td><td>Bái bai! (thân mật)</td></tr><tr><td><button class="say">慢走！</button></td><td>Màn zǒu!</td><td>Đi thong thả nhé! (chủ nhà tiễn khách)</td></tr></tbody></table></div><h4>Hội thoại mẫu</h4><div class="note"><b>A:</b> <button class="say">你好！你好吗？</button><br>Nǐ hǎo! Nǐ hǎo ma? (Chào bạn! Bạn khỏe không?)<br><b>B:</b> <button class="say">我很好，谢谢。你呢？</button><br>Wǒ hěn hǎo, xièxie. Nǐ ne? (Mình khỏe, cảm ơn. Còn bạn?)<br><b>A:</b> <button class="say">我也很好。</button><br>Wǒ yě hěn hǎo. (Mình cũng khỏe.)</div><h4>Chào hỏi kiểu cổ trang</h4><div class="table-wrap"><table><thead><tr><th>Câu chào</th><th>Pinyin</th><th>Nghĩa / cách dùng</th></tr></thead><tbody><tr><td><button class="say">久仰！</button></td><td>Jiǔyǎng!</td><td>Ngưỡng mộ đã lâu (lịch sự, nay vẫn dùng khi trang trọng)</td></tr><tr><td><button class="say">别来无恙？</button></td><td>Bié lái wú yàng?</td><td>Từ ngày chia tay vẫn bình an chứ?</td></tr><tr><td><button class="say">后会有期！</button></td><td>Hòu huì yǒu qī!</td><td>Hẹn ngày tái ngộ!</td></tr></tbody></table></div>
  </div></details>
</template>

<template class="lesson" data-id="so-dem" data-title="Số đếm" data-han="数"
  data-desc="Số từ 0 đến hàng tỷ, tiền, phần trăm, phân số và luyện tập." data-tags="chữ số đếm 数字" data-embed="emb-sodem"></template>
<script type="application/json" id="emb-sodem">"\u003c!doctype html>\u003chtml lang=\"vi\" data-theme=\"light\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cstyle>body{margin:0}\u003c/style>\u003c/head>\u003cbody>\n\u003ctitle>Bí Kíp Số Đếm\u003c/title>\n\u003cmeta name=\"claude:viewport-fit-sides\" content=\"cover\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap\">\n\u003cstyle>\n/* Bố cục: dải đầu xanh navy (Thủy), thanh tab dính, nội dung trên nền trắng bạc (Kim), đường viền champagne mảnh làm điểm nhấn kim loại. Không dùng đỏ, cam, hồng, tím (Hỏa). */\n:root{\n  --bg:#EDF1F5; --surface:#FFFFFF; --surface2:#E3E9F0; --ink:#0E2238; --muted:#52657A; --line:#CCD6E0;\n  --thuy:#14507A; --thuy-soft:#DDEBF5; --kim-soft:#EEF2F6; --gold:#B09A62; --gold-lt:#D9C58F;\n  --hero-a:#0B2A45; --hero-b:#14507A; --btn:#0B2A45; --focus:#14507A;\n  --key-bg:#F1EBD5; --key-ink:#6B5A22;\n  --ok:#0F766E; --ok-soft:#D6EEEB; --no:#475569; --no-soft:#E2E8EF;\n  --f-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;\n  --f-han:'Noto Serif SC','Songti SC','STSong','SimSun',serif;\n  --r:14px;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#08131F; --surface:#0F2133; --surface2:#16304A; --ink:#E7EEF6; --muted:#9DB0C4; --line:#25405A;\n    --thuy:#7DBDE8; --thuy-soft:#12324A; --kim-soft:#13283B; --gold:#CDB77C; --gold-lt:#D9C58F;\n    --hero-a:#061726; --hero-b:#0F3A5C; --btn:#2A6CA0; --focus:#9BD0F2;\n    --key-bg:#2B3440; --key-ink:#E3CF94;\n    --ok:#4FD1C5; --ok-soft:#0E3A3C; --no:#AFBDCC; --no-soft:#1E3248;\n    color-scheme:dark;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#08131F; --surface:#0F2133; --surface2:#16304A; --ink:#E7EEF6; --muted:#9DB0C4; --line:#25405A;\n  --thuy:#7DBDE8; --thuy-soft:#12324A; --kim-soft:#13283B; --gold:#CDB77C; --gold-lt:#D9C58F;\n  --hero-a:#061726; --hero-b:#0F3A5C; --btn:#2A6CA0; --focus:#9BD0F2;\n    --key-bg:#2B3440; --key-ink:#E3CF94;\n  --ok:#4FD1C5; --ok-soft:#0E3A3C; --no:#AFBDCC; --no-soft:#1E3248;\n  color-scheme:dark;\n}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--ink);font:16px/1.65 var(--f-body);-webkit-text-size-adjust:100%}\nbody::before{content:\"\";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hero-a)}\n.hz{font-family:var(--f-han);font-weight:700}\n.wrap{max-width:980px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}\nbutton{font-family:inherit}\n:focus-visible{outline:3px solid var(--focus);outline-offset:2px}\n\n/* Hero */\n.hero{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#EAF1F7;position:relative;overflow:hidden}\n.hero .wrap{position:relative;z-index:1;padding-block:30px 26px}\n.hero svg{position:absolute;right:-10px;bottom:-6px;width:300px;max-width:60%;opacity:.55;z-index:0}\n.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#B9C9D9;font-weight:600}\nh1{font-size:clamp(28px,5.2vw,42px);line-height:1.15;margin:6px 0 10px;font-weight:700;text-wrap:balance}\nh1 .hz{color:var(--gold-lt);font-size:.8em;margin-left:6px;white-space:nowrap}\n.hero p{max-width:50ch;margin:0;color:#CBD8E5}\n\n/* Tab bar */\n.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hero-a);border-bottom:1px solid rgba(255,255,255,.14)}\n.tabs{display:flex;gap:8px;padding-block:10px}\n.tab{flex:1;min-height:46px;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:transparent;color:#D5E0EB;font-size:15px;font-weight:600;cursor:pointer}\n.tab .hz{font-size:18px;color:var(--gold-lt)}\n.tab:hover{background:rgba(255,255,255,.08)}\n.tab[aria-selected=\"true\"]{background:#EEF3F8;color:#0B2A45;border-color:#EEF3F8;box-shadow:inset 0 -3px 0 var(--gold)}\n.tab[aria-selected=\"true\"] .hz{color:#0B2A45}\n.tab:focus-visible{outline-color:#BFE3FA}\n\nmain .wrap{padding-block:22px 56px}\n.stack{display:grid;gap:16px}\n\n/* Accordion rows */\n.accs{display:grid;gap:12px}\n.chap{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;width:100%;min-height:76px;padding:14px 18px;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);cursor:pointer;scroll-margin-top:84px}\n.chap .no{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;border:2px solid var(--gold);font:700 24px var(--f-han);color:var(--thuy);background:var(--kim-soft)}\n.chap .tt{display:grid;gap:0;min-width:0}\n.chap .t{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--thuy)}\n.chap .s{font-size:17px;font-weight:600;line-height:1.35;text-wrap:balance}\n.chap .chev{width:11px;height:11px;margin-right:4px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(45deg);transition:transform .2s;opacity:.7}\n.chap:hover{border-color:var(--thuy)}\n.chap[aria-expanded=\"true\"]{background:var(--hero-a);border-color:var(--hero-a);color:#EAF1F7;box-shadow:inset 0 -3px 0 var(--gold)}\n.chap[aria-expanded=\"true\"] .no{background:transparent;color:var(--gold-lt)}\n.chap[aria-expanded=\"true\"] .t{color:var(--gold-lt)}\n.chap[aria-expanded=\"true\"] .chev{transform:rotate(-135deg) translate(-2px,-2px)}\n.panel{display:grid;gap:16px;padding-block:16px 8px}\n.gotolc{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:20px}\n.gotolc p{margin:0;max-width:44ch}\n\n/* Cards and headings */\n.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}\n.card h3{margin:0 0 6px;font-size:18px;line-height:1.3}\n.card h4{margin:0 0 4px;font-size:15px}\n.card p{margin:0 0 10px}\n.card p:last-child{margin-bottom:0}\n.muted{color:var(--muted)}\n.chead{display:flex;gap:16px;align-items:center;padding:4px 2px 2px}\n.chead .big{flex:none;width:58px;height:58px;display:grid;place-items:center;border-radius:50%;border:2px solid var(--gold);font-size:30px;color:var(--thuy);background:radial-gradient(circle at 30% 25%,var(--surface),var(--kim-soft))}\n.chead h2{margin:0;font-size:clamp(21px,3.6vw,26px);line-height:1.25;text-wrap:balance}\n.chead p{margin:2px 0 0;color:var(--muted)}\n.py{color:var(--thuy);font-weight:600}\n.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--thuy)}\n\n/* 0-10 cards */\n.hint{font-size:13.5px;color:var(--muted);margin:0 0 12px}\n.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px}\n.num{position:relative;display:grid;justify-items:center;align-content:start;gap:2px;padding:26px 8px 12px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,var(--surface),var(--kim-soft));color:var(--ink);cursor:pointer;text-align:center;min-width:0}\n.num::before{content:\"\";position:absolute;inset:0 14px auto;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}\n.num .d{position:absolute;top:8px;left:11px;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}\n.num .h{font:700 54px/1.1 var(--f-han)}\n.num .p{font-weight:600;font-size:18px;color:var(--thuy)}\n.num .v{font-size:12.5px;color:var(--muted)}\n.num .tg{font-size:12px;color:var(--ink);background:var(--thuy-soft);border-radius:999px;padding:2px 9px;margin-top:4px}\n.num:hover{border-color:var(--thuy)}\n.num.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}\n\n/* Notes */\n.notes{display:grid;gap:
