<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thư Quán CoBi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap">
<style>
:root{--bg:#EADFBE;--card:#F7F1DE;--ink:#2B3A42;--gold:#B8893A;--th:#2F6F8F;--thd:#1F4A63;--ngoc:#4C8C8A;--lock:#DCCFA6}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 'Noto Serif',serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:460px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0}h2{font-size:18px;margin:12px 0 6px}.sm{font-size:13px;margin:6px 0}.c{text-align:center}
.btn,.nav button{border:2px solid var(--thd);background:var(--thd);color:var(--card);border-radius:8px;padding:12px 16px;font:700 16px 'Noto Serif',serif;cursor:pointer;width:100%;margin:6px 0}
.btn.alt,.nav button{background:var(--card);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px;margin:10px 0}
input{height:48px;border:2px solid var(--thd);border-radius:6px;background:var(--card);padding:0 12px;font:16px 'Noto Serif',serif;color:var(--ink)}
.card{background:var(--card);border:2px solid var(--gold);border-radius:10px;padding:14px;margin:10px 0}
.top{display:flex;justify-content:space-between;font-weight:700}
.bar{height:12px;border:2px solid var(--thd);border-radius:8px;background:var(--card);margin-top:6px}.bar i{display:block;height:100%;background:var(--th);border-radius:5px}
.stage{position:relative;height:min(64vh,470px);border:2px solid var(--gold);border-radius:10px;overflow:hidden;margin:10px 0;touch-action:none}
.floor{position:absolute;left:0;right:0;bottom:0;height:70px;background:#6B5336}
.win{position:absolute;left:50%;top:18px;width:110px;height:110px;margin-left:-55px;border:6px solid #3A2A1E;border-radius:50%;background:var(--ngoc)}
.ch{position:absolute;left:50%;margin-left:-130px;bottom:6px;width:260px;pointer-events:none}
.fi{position:absolute;touch-action:none;user-select:none;-webkit-user-drag:none}.fi.ed{cursor:grab;outline:2px dashed var(--gold)}
.nav{display:flex;gap:6px}.nav button{padding:10px 4px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.nd{height:50px;border:2px solid var(--thd);border-radius:25px;background:var(--lock);color:var(--ink);font:700 14px 'Noto Serif',serif;cursor:pointer;line-height:1.1;padding:0}
.nd small{display:block;font-size:10px;font-weight:400}.nd.ok{background:var(--ngoc);color:var(--card)}.nd.go{background:var(--thd);color:var(--card)}.nd.lk{opacity:.7}
.nd.kb{border:3px solid var(--gold)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border:2px solid var(--thd);border-radius:8px;background:var(--card);color:var(--ink);font:16px 'Noto Serif',serif;cursor:pointer}
.opt.good{background:var(--ngoc);color:var(--card)}.opt.bad{background:#C9B7A0;text-decoration:line-through}
.items{display:flex;gap:8px;flex-wrap:wrap}.it{width:84px;padding:4px;border:2px solid var(--gold);border-radius:8px;background:var(--card);color:var(--ink);font:12px 'Noto Serif',serif;cursor:pointer;text-align:center}
.it[aria-pressed=true]{border-color:var(--thd);outline:3px solid var(--thd)}.it img{height:56px;max-width:70px;object-fit:contain}
.two{display:flex;gap:10px}.two .card{flex:1;text-align:center;cursor:pointer}.two img{width:100%}
.row{display:flex;justify-content:space-between;align-items:center;border:2px solid var(--gold);border-radius:8px;background:var(--card);padding:10px 14px;margin:8px 0}
.err{color:#7A2E1F;font-weight:700;font-size:14px;min-height:20px}
#toast{display:none;position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0));max-width:428px;margin:0 auto;background:var(--thd);color:var(--card);padding:12px 16px;border-radius:8px;z-index:9}
#load{display:none;position:fixed;inset:0;background:rgba(31,74,99,.55);align-items:center;justify-content:center;color:#fff;font-weight:700;z-index:8}
</style></head><body>
<div id="app"></div><div id="toast"></div><div id="load">Đang kết nối…</div>
<script>
/* ===== CẤU HÌNH ===== */
const API_URL='https://script.google.com/macros/s/AKfycbysC96nOs5ovfRSBtBfj_HqW0Vu1Ej9mzNs75isCHl6ZjeW5kqxZJXE7mmApovSDx-mmQ/exec';
const PASS=50; // điểm qua ải (khớp CauHinh: diem_dat)
const WALL=['#DCCB9C','#D3D6B8','#C2D3C4','#B3CBCF','#A3C0CC']; // màu phòng theo tầng (tạm, sau thay bằng tranh)
const PH={thuong:'Thường',tinh:'Tinh',quy:'Quý',bao:'Bảo vật'};
const DEF={ban:{x:3,y:66,w:34},thucung:{x:62,y:60,w:32},tay:{x:4,y:44,w:30}};

/* ===== CỬA ẢI =====
 Bài tập trắc nghiệm và trắc nghiệm nghe: Thư Chủ nhập trong trang tính BaiTap, KHÔNG cần sửa code.
 Muốn làm một game riêng cho một thiên: LV[5]={run:(box,done)=>{ ...; done(điểm 0-100) }}; */
const LV={};
const tenThien=n=>n===0?'Thiên Mở Đầu':'Thiên '+n;

/* ===== TIỆN ÍCH ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=null,cred=null,W=null,Q=null,PEND=null,GAME=null;
const app=h=>{$('#app').innerHTML='<div class="wrap">'+h+'</div>';scrollTo(0,0)};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3500)}
async function api(a,d){
 $('#load').style.display='flex';
 try{
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action:a},cred,d||{}))});
  const j=await r.json(); if(!j.ok)throw new Error(j.error||'Có lỗi xảy ra');
  if(j.state)S=j.state; return j;
 }catch(e){throw new Error(e instanceof TypeError?'Không kết nối được. Hãy kiểm tra mạng rồi thử lại.':e.message)}
 finally{$('#load').style.display='none'}
}
const DM=()=>Object.fromEntries(S.danhMuc.map(d=>[d.ma,d]));
const best=n=>{const t=S.tienDo.find(x=>x.thien===n);return t?t.diem:-1};
const passed=n=>best(n)>=PASS;
const playable=n=>n===0||(!!S.hv.gioiTinh&&n>=S.hv.thienBatDau&&n<=S.lop.thienDangMo);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* ===== SÂN KHẤU: nhân vật + vật phẩm ===== */
function stage(edit){
 const T=edit?W:S.tuDo,dm=DM(),g=S.hv.gioiTinh||'nam';
 const w=T.filter(t=>t.dangMac&&dm[t.ma]).map(t=>({t,d:dm[t.ma]}));
 const of=l=>w.filter(o=>o.d.loai===l);
 const ao=of('ao')[0],dau=of('dau')[0];
 let base=ao?ao.d.anh:g+'-goc.png'; if(dau&&dau.d.anTramGo)base=base.replace('.png','_np.png');
 const free=o=>{const df=DEF[o.d.loai]||DEF.tay,x=o.t.x==null?df.x:o.t.x,y=o.t.y==null?df.y:o.t.y;
  return `<img class="fi${edit?' ed':''}" data-ma="${esc(o.t.ma)}" src="img/${esc(o.d.anh)}" alt="${esc(o.d.ten)}" draggable="false" style="left:${x}%;top:${y}%;width:${df.w}%${o.d.loai==='tay'?';transform:rotate(-25deg)':''}">`};
 return `<div class="stage" id="stage" style="background:${WALL[S.tang-1]}"><div class="win"></div><div class="floor"></div>
 ${of('ban').map(free).join('')}${of('thucung').map(free).join('')}
 <img class="ch" src="img/${base}" alt="Nhân vật">${dau?`<img class="ch" src="img/${esc(dau.d.anh)}" alt="">`:''}${of('tay').map(free).join('')}</div>`;
}

/* ===== MÀN HÌNH ===== */
function login(msg){
 let v={};try{v=JSON.parse(localStorage.getItem('cobi_last')||'{}')}catch(e){}
 app(`<div class="c"><img src="img/logo.png" alt="" style="max-width:120px" onerror="this.style.display='none'"><h1>Thư Quán CoBi</h1><p class="sm">Một ngày nhập Thư Quán, Trọn đời hành Hán Ngữ</p></div>
 <label class="field">Mã Lớp<input id="f1" value="${esc(v.malop||'')}" autocomplete="off"></label>
 <label class="field">Tên Lữ Khách<input id="f2" value="${esc(v.ten||'')}" autocomplete="off"></label>
 <label class="field">Pass<input id="f3" type="password" autocomplete="off"></label>
 <div class="err" id="err">${esc(msg||'')}</div><button class="btn" data-act="doLogin">Nhập Thư Quán</button>
 <p class="sm c">Tài khoản do Thư Chủ cấp cho Lữ khách.</p>`);
}
async function doLogin(){
 cred={malop:$('#f1').value.trim(),ten:$('#f2').value.trim(),pass:$('#f3').value.trim()};
 try{await api('login');try{localStorage.setItem('cobi_last',JSON.stringify({malop:cred.malop,ten:cred.ten}));sessionStorage.setItem('cobi',JSON.stringify(cred))}catch(e){} go()}
 catch(e){cred=null;$('#err').textContent=e.message}
}
function go(){ if(!passed(0))return intro(); if(!S.hv.gioiTinh)return pick(); home() }
function intro(){app(`<h1>Chào mừng Lữ khách</h1><div class="card">Hãy vượt ải <b>Thiên Mở Đầu</b> để được chọn nhân vật và bước vào Thư Quán.</div><button class="btn" data-act="play" data-n="0">Bắt đầu</button><button class="btn alt" data-act="logout">Thoát</button>`)}
function pick(){app(`<h1>Chọn nhân vật</h1><div class="two"><div class="card" data-act="setSex" data-g="nam"><img src="img/nam-goc.png" alt="Nam"><b>Nam</b></div><div class="card" data-act="setSex" data-g="nu"><img src="img/nu-goc.png" alt="Nữ"><b>Nữ</b></div></div><p class="sm c">Chọn một lần, không đổi được.</p>`)}
function home(){
 const nx=S.tangKe,pct=nx?Math.min(100,Math.round(S.tuVi/nx.can*100)):100;
 const naming=!S.hv.tenNhanVat&&S.tienDo.some(t=>t.thien>=1&&t.diem>=PASS);
 const nxt=[...Array(39).keys()].find(n=>playable(n)&&!passed(n));
 app(`<div class="top"><span>Tầng ${S.tang} · ${esc(S.tenTang)}</span><span>${esc(S.hv.tenNhanVat||S.hv.ten)}</span></div><div class="bar"><i style="width:${pct}%"></i></div>
 <p class="sm">Điểm tu vi ${S.tuVi}${nx?' / '+nx.can+' để lên tầng '+esc(nx.ten):' · tầng cao nhất'} · Sưu tầm ${S.suuTam} · Tổng ${S.tong}</p>${stage(false)}
 ${naming?`<div class="card"><b>Đặt tên cho nhân vật</b><input id="nm" maxlength="20" style="width:100%;margin-top:8px" placeholder="2 đến 20 ký tự"><div class="err" id="err"></div><button class="btn" data-act="setName">Lưu tên</button></div>`:''}
 ${nxt!=null?`<button class="btn" data-act="play" data-n="${nxt}">Tiếp tục: ${tenThien(nxt)}</button>`:''}
 <div class="nav"><button data-act="map">Bản đồ</button><button data-act="ward">Tủ đồ</button><button data-act="kb">Kim Bảng</button><button data-act="logout">Thoát</button></div>`);
}
function map(){
 const nodes=[...Array(39).keys()].map(n=>{const p=passed(n),pl=playable(n),k=[10,20,30,38].includes(n)?' kb':'';
  return `<button class="nd ${p?'ok':pl?'go':'lk'}${k}" data-act="play" data-n="${n}">${n}${best(n)>=0?`<small>${best(n)}</small>`:''}</button>`}).join('');
 app(`<h1>Bản đồ Thiên học</h1><p class="sm">Số 0 là Thiên Mở Đầu. Viền vàng: thiên có công bố Kim Bảng.</p><div class="grid">${nodes}</div>
 <p class="sm">Xanh ngọc: đã qua · Xanh thủy đậm: đang mở · Nhạt: chưa mở.</p><button class="btn alt" data-act="home">Về Thư Quán</button>`);
}
const norm=s=>String(s==null?'':s).normalize('NFC').trim().toLowerCase();
function speak(t,f){
 try{
  if(f){new Audio('audio/'+f).play().catch(()=>toast('Không phát được file âm thanh.'));return}
  if(!('speechSynthesis' in window))return toast('Thiết bị chưa hỗ trợ đọc tiếng Trung.');
  const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.8;
  const v=speechSynthesis.getVoices().find(x=>/^zh/i.test(x.lang));if(v)u.voice=v;
  speechSynthesis.cancel();speechSynthesis.speak(u);
 }catch(e){toast('Không phát được âm thanh.')}
}
async function play(n){
 n=+n; if(!playable(n))return toast('Thiên này chưa được mở cho bạn.');
 if(LV[n]&&LV[n].run){app(`<h2>${tenThien(n)}</h2><div id="box"></div>`);return LV[n].run($('#box'),s=>finish(n,s))}
 let rows;try{rows=(await api('baitap',{thien:n})).baiTap}catch(e){return toast(e.message)}
 const g=rows.find(r=>/game/i.test(r.dang));
 if(g){const p=g.hoi.trim();if(!/^games\/[\w.-]+\.html$/.test(p))return toast('Đường dẫn game chưa hợp lệ.');
  GAME={n};app(`<h2>${tenThien(n)}</h2><iframe id="gf" src="${esc(p)}" style="width:100%;height:68vh;border:2px solid var(--gold);border-radius:10px;background:#fff" allow="autoplay"></iframe><button class="btn alt" data-act="home">Thoát</button>`);return}
 const qs=rows.map(r=>({hoi:r.hoi,am:r.amThanh,dap:r.dapAn,listen:/nghe/i.test(r.dang),o:shuffle(r.chon.map(s=>({s,c:norm(s)===norm(r.dapAn)})))})).filter(q=>q.o.some(o=>o.c));
 if(!qs.length)return toast('Cửa ải này Thư Chủ đang xây.');
 Q={n,i:0,ok:0,qs};showQ();
}
function showQ(){
 const q=Q.qs[Q.i];
 app(`<p class="sm">${tenThien(Q.n)} · Câu ${Q.i+1}/${Q.qs.length}</p>
 ${q.listen?'<div class="card c"><button class="btn" data-act="say">▶ Nghe</button><p class="sm">Nghe rồi chọn đáp án đúng.</p></div>':`<div class="card"><b>${esc(q.hoi)}</b></div>`}
 ${q.o.map((o,i)=>`<button class="opt" data-act="ans" data-i="${i}">${esc(o.s)}</button>`).join('')}<div id="nx"></div>`);
 if(q.listen)speak(q.hoi,q.am);
}
function ans(i){
 const q=Q.qs[Q.i]; if(q.done)return; q.done=1; if(q.o[i].c)Q.ok++;
 document.querySelectorAll('.opt').forEach((b,k)=>{b.classList.add(q.o[k].c?'good':(k==i?'bad':'x'))});
 $('#nx').innerHTML=(q.listen?`<p class="sm c">Đáp án: <b>${esc(q.dap)}</b> · ${esc(q.hoi)}</p>`:'')+`<button class="btn" data-act="next">${Q.i+1<Q.qs.length?'Câu tiếp':'Xem kết quả'}</button>`;
}
function next(){ if(++Q.i<Q.qs.length)showQ(); else finish(Q.n,Math.round(Q.ok/Q.qs.length*100)) }
async function finish(n,score){
 const before=S.tang;
 try{const r=await api('submit',{thien:n,diem:score});PEND=null;result(n,score,r,before)}
 catch(e){PEND={n,score};app(`<h1>Chưa gửi được điểm</h1><div class="card">${esc(e.message)}<br>Điểm của bạn: <b>${score}</b>. Đừng đóng trang, hãy bấm gửi lại.</div><button class="btn" data-act="retry">Gửi lại</button>`)}
}
function result(n,score,r,before){
 const ok=!!r.pham, up=S.tang>before;
 app(`<h1>${ok?'Qua ải!':'Chưa đạt'}</h1><div class="card">Điểm lần này: <b>${score}</b> · Điểm cao nhất: <b>${r.best}</b>${r.pham?'<br>Phẩm cấp: <b>'+PH[r.pham]+'</b>':'<br>Cần từ '+PASS+' điểm để qua ải. Hãy thử lại!'}</div>
 ${r.qua.length?'<h2>Vật phẩm nhận được</h2><div class="items">'+r.qua.map(q=>{const d=DM()[q.ma];return `<div class="it">${d?`<img src="img/${esc(d.anh)}" alt="">`:''}${esc(q.ten)}<br>${PH[q.pham]}</div>`}).join('')+'</div>':''}
 ${up?`<div class="card"><b>Chúc mừng! Bạn lên tầng ${S.tang} · ${esc(S.tenTang)}</b></div>`:''}
 <button class="btn" data-act="${n===0&&ok&&!S.hv.gioiTinh?'pick':'home'}">${n===0&&ok&&!S.hv.gioiTinh?'Chọn nhân vật':'Về Thư Quán'}</button>
 <button class="btn alt" data-act="play" data-n="${n}">Làm lại ải này</button>`);
}
function ward(){
 W=S.tuDo.map(t=>Object.assign({},t));
 const dm=DM();
 app(`<h1>Tủ đồ</h1><p class="sm">Chạm để mặc hoặc tháo. Kéo quạt, thú cưng, đồ bàn để đặt đúng chỗ bạn thích.</p><div id="st">${stage(true)}</div><div id="wl"></div>
 <button class="btn" data-act="saveW">Lưu tủ đồ</button><button class="btn alt" data-act="home">Hủy</button>`);wList();
}
function wList(){
 const dm=DM();
 $('#wl').innerHTML=W.length?'<div class="items">'+W.map((t,i)=>{const d=dm[t.ma];return d?`<button class="it" data-act="wear" data-i="${i}" aria-pressed="${t.dangMac}"><img src="img/${esc(d.anh)}" alt="">${esc(d.ten)}<br>${PH[t.pham]||''}</button>`:''}).join('')+'</div>':'<p class="sm">Bạn chưa có vật phẩm. Hãy vượt ải để nhận!</p>';
 $('#st').innerHTML=stage(true);
}
function wear(i){
 const dm=DM(),t=W[+i],l=dm[t.ma].loai;
 if(!t.dangMac&&(l==='ao'||l==='dau'))W.forEach(o=>{if(dm[o.ma]&&dm[o.ma].loai===l)o.dangMac=false});
 t.dangMac=!t.dangMac;wList();
}
async function saveW(){
 try{await api('saveWardrobe',{items:W.map(t=>({ma:t.ma,dangMac:t.dangMac,x:t.x,y:t.y}))});toast('Đã lưu tủ đồ.');home()}catch(e){toast(e.message)}
}
async function kb(){
 try{const r=await api('kimbang');const k=r.kimBang;
  app(`<h1 class="c">Kim Bảng</h1>${k.lan?`<p class="sm c">Lần công bố thứ ${k.lan}</p>`+k.rows.map(x=>`<div class="row"><div><b>${x.hang}. ${esc(x.nhanVat||x.ten)}</b><br><small>${esc(x.danhHieu)}</small></div><div style="text-align:right"><small>${x.tuVi} + ${x.suuTam}</small><br><b>${x.tong}</b></div></div>`).join(''):'<div class="card">Thư Chủ chưa công bố Kim Bảng.</div>'}<button class="btn alt" data-act="home">Về Thư Quán</button>`)}
 catch(e){toast(e.message)}
}
const A={
 doLogin,home:()=>home(),map,say:()=>{const q=Q.qs[Q.i];speak(q.hoi,q.am)},play:d=>play(d.n),ans:d=>ans(+d.i),next,pick,ward,wear:d=>wear(d.i),saveW,kb,
 retry:()=>PEND&&finish(PEND.n,PEND.score),
 logout(){cred=null;S=null;try{sessionStorage.removeItem('cobi')}catch(e){}login()},
 async setSex(d){try{await api('setProfile',{gioiTinh:d.g});home()}catch(e){toast(e.message)}},
 async setName(){try{await api('setProfile',{tenNhanVat:$('#nm').value});home()}catch(e){$('#err').textContent=e.message}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&A[b.dataset.act])A[b.dataset.act](b.dataset)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#f3')&&document.activeElement.tagName==='INPUT')doLogin()});
/* game riêng trong iframe báo điểm: parent.postMessage({type:'cobi-score',score:0-100},location.origin) */
window.addEventListener('message',e=>{const f=$('#gf');if(!GAME||!f||e.source!==f.contentWindow||e.origin!==location.origin)return;const d=e.data;
 if(d&&d.type==='cobi-score'){const n=GAME.n;GAME=null;finish(n,Math.max(0,Math.min(100,Math.round(+d.score||0))))}});
/* kéo thả trong Tủ đồ */
let drag=null;
document.addEventListener('pointerdown',e=>{const im=e.target.closest('.fi.ed');if(!im)return;drag={im,r:$('#stage').getBoundingClientRect(),dx:e.clientX-im.getBoundingClientRect().left,dy:e.clientY-im.getBoundingClientRect().top};im.setPointerCapture(e.pointerId);e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!drag)return;const{im,r,dx,dy}=drag;const x=Math.max(-5,Math.min(95,(e.clientX-dx-r.left)/r.width*100)),y=Math.max(0,Math.min(95,(e.clientY-dy-r.top)/r.height*100));im.style.left=x+'%';im.style.top=y+'%';const t=W.find(o=>o.ma===im.dataset.ma);if(t){t.x=Math.round(x*10)/10;t.y=Math.round(y*10)/10}});
document.addEventListener('pointerup',()=>{drag=null});
