<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bài tập ngữ pháp tiếng Trung</title>
<style>
:root{--bg:#faf6ef;--card:#fff;--ink:#2a2622;--muted:#6f675e;--line:#e6dccd;--accent:#1f3a5f;--ai:#fff;--soft:#e3eaf4;--ok:#2e7d4f;--oks:#e1f2e7;--bad:#9a6700;--bads:#fbf0d3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#211e1b;--ink:#f1ebe3;--muted:#a89f94;--line:#3a352f;--accent:#8fb4e8;--ai:#0e1a2b;--soft:#1f2c40;--ok:#6cc58c;--oks:#1f3326;--bad:#e8b84a;--bads:#3a3015}}
:root[data-theme="dark"]{--bg:#171513;--card:#211e1b;--ink:#f1ebe3;--muted:#a89f94;--line:#3a352f;--accent:#8fb4e8;--ai:#0e1a2b;--soft:#1f2c40;--ok:#6cc58c;--oks:#1f3326;--bad:#e8b84a;--bads:#3a3015}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:1.5rem;margin:6px 0}
.sub{color:var(--muted);margin:0 0 14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tag{font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--accent)}
.tag.lv{background:transparent;border:1px solid var(--line);color:var(--muted)}
.set{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;color:var(--ink);font:inherit;cursor:pointer}
.set b{font-size:1.15rem}.meta{color:var(--muted);font-size:.85rem}
.back{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:8px 0}
input[type=search]{width:100%;padding:12px 14px;margin-bottom:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
.st{font-size:1.05rem;margin:26px 0 10px;padding-left:10px;border-left:4px solid var(--accent)}
.st small{color:var(--muted);font-weight:400;margin-left:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.card.ok{border-color:var(--ok)}.card.bad{border-color:var(--bad)}
.qh{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.qn{font-weight:700;color:var(--accent)}
.qt{font-size:1.2rem;margin:4px 0 10px}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--ink)}
.hint{color:var(--muted);font-size:.88rem;margin:0 0 8px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.opt{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:1.1rem}
.opt:hover{border-color:var(--accent)}.opt input{accent-color:var(--accent)}.opt .k{color:var(--muted);font-size:.85rem}
.opt.right{background:var(--oks);border-color:var(--ok)}.opt.wrong{background:var(--bads);border-color:var(--bad)}
.si{margin:10px 0}.si .ln{font-size:1.2rem}
select,input[type=text]{font:inherit;font-size:1.1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
input[type=text]{width:100%;padding:8px 10px}
.sok{border-color:var(--ok)!important;background:var(--oks)!important}.sbad{border-color:var(--bad)!important;background:var(--bads)!important}
.pool,.built{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;padding:8px;border-radius:10px}
.built{border:2px dashed var(--line);margin-bottom:10px}
.tok{font:inherit;font-size:1.15rem;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tok:disabled{opacity:.3}.tok.in{background:var(--soft);border-color:var(--accent)}
.ws{font-size:1.2rem;padding:8px 12px;border-radius:10px;background:var(--bads);margin-bottom:10px}
.fb{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:.95rem}
.fb.ok{background:var(--oks);color:var(--ok)}.fb.bad{background:var(--bads);color:var(--bad)}
.fb .ex{color:var(--ink);display:block;margin-top:4px}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 20px;cursor:pointer;background:var(--accent);color:var(--ai)}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.s{padding:4px 12px;font-size:.85rem;font-weight:500}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.res{margin-top:20px;padding:18px;border-radius:14px;background:var(--soft);text-align:center}
.res .big{font-size:2.2rem;font-weight:800;color:var(--accent)}
.note{color:var(--muted);font-size:.9rem}
.rc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px;margin:12px 0}.rc summary{cursor:pointer;font-weight:600}.rc h3{font-size:1rem;margin:14px 0 6px;color:var(--accent)}.rc table{width:100%;border-collapse:collapse;font-size:.95rem}.rc td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}.rc td.zh{font-size:1.05rem}
.tok[draggable=true]{cursor:grab}.fb summary{cursor:pointer;color:var(--ok)}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ===== KHO DỮ LIỆU: thêm bài mới = thêm 1 khối vào SETS ===== */
/* Bài trắc nghiệm đơn giản: mk({id,level,name,instr,words,rows:[[câu, đáp án (số thứ tự từ 0), giải thích]]}) */
const mk=d=>({id:d.id,level:d.level,name:d.name,title:d.instr,sub:d.name,sections:[{title:d.instr,sub:'',items:d.rows.map(r=>({type:'mc',text:r[0],opts:d.words,ans:r[1],exp:r[2]}))}]});
const _B=(t,a,e)=>({type:"build",hint:"Kéo thả (hoặc bấm) các từ để ghép thành câu hoàn chỉnh.",tokens:t,accept:a,exp:e});
const _R=(src,pre,acc,e)=>({type:"rewrite",hint:"Viết lại bằng câu chữ 把, điền phần còn thiếu sau dấu →.",parts:[{src,pre,accept:acc}],exp:e});
const _T=(vi,acc,show,e)=>({type:"trans",hint:"Dịch sang tiếng Trung bằng câu chữ 把.",parts:[{vi,accept:acc,show}],exp:e});
const _F=(wrong,acc,show,e)=>({type:"fix",hint:"Tìm lỗi và viết lại thành câu chữ 把 đúng.",wrong,accept:acc,show,exp:e});
const SETS=[
{id:"hsk3-bonguu",level:"HSK3",name:"Bổ ngữ",title:"HSK 3B – Bài 8: Bài tập bổ ngữ",sub:"Bổ ngữ kết quả · khả năng · trạng thái · xu hướng.",
 tags:["结果补语","可能补语","状态补语","趋向补语"],sections:[
 {title:"一、选择正确答案",sub:"Chọn đáp án đúng",items:[
  {type:"mc",topic:"结果补语",text:"作业我已经写____了,可以出去玩了。",opts:["完","懂","见","错"],ans:0,exp:"写完 = viết xong. 完 là bổ ngữ kết quả, chỉ động tác đã hoàn thành."},
  {type:"mc",topic:"状态补语",text:"他汉语说____很流利。",opts:["的","得","地","了"],ans:1,exp:"说得很流利: động từ + 得 + bổ ngữ trạng thái (đánh giá mức độ, cách thức)."},
  {type:"mc",topic:"趋向补语",text:"老师走____教室来,同学们都站了起来。",opts:["进","进来","进去","起来"],ans:0,exp:"走进教室: 进 là bổ ngữ xu hướng đơn. Nếu thêm 来/去 thì tân ngữ nơi chốn đứng giữa: 走进教室来."},
  {type:"mc",topic:"可能补语",text:"这个箱子太小了,放____这么多东西。",opts:["不下","不到","不好","不见"],ans:0,exp:"放不下 = để không vừa. Phủ định của bổ ngữ khả năng: động từ + 不 + bổ ngữ."}]},
 {title:"二、选词填空",sub:"Chọn từ điền vào chỗ trống",items:[
  {type:"fill",topic:"结果补语",bank:["完","见","懂","错","对"],hint:"Từ cho sẵn: 完 / 见 / 懂 / 错 / 对. Mỗi từ chỉ dùng một lần, có 2 từ thừa.",
   parts:[{pre:"对不起,我走",post:"路了,所以来晚了。",ans:"错"},{pre:"昨天我在超市看",post:"小李了,他说他下个月去中国。",ans:"见"},{pre:"老师讲了两遍,我才听",post:"。",ans:"懂"}],
   exp:"走错 (đi nhầm), 看见 (nhìn thấy), 听懂 (nghe hiểu). Từ thừa: 完, 对."}]},
 {title:"三、排序与改错",sub:"Sắp xếp câu và sửa lỗi sai",items:[
  {type:"build",topic:"状态补语",level:"Trung bình",hint:"Bấm vào các từ để ghép thành câu hoàn chỉnh.",tokens:["得","汉字","写","她","很漂亮"],accept:["她汉字写得很漂亮"],exp:"Có tân ngữ 汉字 thì đưa lên trước động từ: 她汉字写得很漂亮. (Cũng có thể lặp động từ: 她写汉字写得很漂亮.)"},
  {type:"build",topic:"趋向补语",level:"Trung bình",hint:"Bấm vào các từ để ghép thành câu hoàn chỉnh.",tokens:["回","她","来","家","了"],accept:["她回家来了"],exp:"Tân ngữ nơi chốn 家 đứng giữa 回 và 来: 她回家来了."},
  {type:"fix",topic:"状态补语",level:"Khó",hint:"Tìm chỗ sai và viết lại cả câu cho đúng.",wrong:"他说汉语得很好,老师常常表扬他。",accept:["他汉语说得很好老师常常表扬他","他说汉语说得很好老师常常表扬他","他汉语说得很好","他说汉语说得很好"],show:"他汉语说得很好,老师常常表扬他。 / 他说汉语说得很好,老师常常表扬他。",exp:"Khi có tân ngữ, phải lặp động từ (说汉语说得很好) hoặc đưa tân ngữ lên trước (汉语说得很好). Không nói 说汉语得很好."},
  {type:"fix",topic:"可能补语",level:"Khó",hint:"Tìm chỗ sai và viết lại cả câu cho đúng.",wrong:"我听见不老师的话,请你再说一遍。",accept:["我听不见老师的话请你再说一遍","我听不见老师的话"],show:"我听不见老师的话,请你再说一遍。",exp:"Phủ định của bổ ngữ khả năng: động từ + 不 + bổ ngữ (听不见), không nói 听见不."}]},
 {title:"四、翻译",sub:"Dịch sang tiếng Trung",items:[
  {type:"trans",topic:"综合",hint:"Mỗi câu kiểm tra một loại bổ ngữ: khả năng, trạng thái, kết quả, xu hướng.",parts:[
   {vi:"Thầy nói nhanh quá, em nghe không hiểu.",accept:["老师说得太快了我没听懂","老师说得太快我没听懂"],show:"老师说得太快了,我听不懂。"},
   {vi:"Cô ấy hát rất hay.",accept:["她唱得很好听","她唱得很好","她歌唱得很好","她歌唱得很好听","她唱歌唱得很好","她唱歌唱得很好听"],show:"她唱得很好听。 / 她歌唱得很好。"},
   {vi:"Bài tập tôi làm xong rồi.",accept:["作业我做完了","我作业做完了","我做完作业了","我做完了作业","作业我写完了","我写完作业了","我写完了作业"],show:"我做完作业了。"},
   {vi:"Anh ấy mang một cuốn sách đến.",accept:["他带来了一本书","他带来一本书","他带了一本书来","他带一本书来","他拿来了一本书","他拿来一本书","他拿了一本书来","他拿一本书来"],show:"他带来了一本书。 / 他拿来了一本书。"}],
   exp:"Lần lượt là: 没听懂 (kết quả), 唱得很好听 (trạng thái), 做完 (kết quả), 带来 (xu hướng). Có thể còn cách diễn đạt đúng khác, hãy nhờ giáo viên kiểm tra."}]}
]},
{id:"hsk3-sosanh",level:"HSK3",name:"So sánh 比较句",title:"HSK 3 – So sánh 比较句",sub:"So sánh hơn (比), so sánh bằng (跟……一样), so sánh thua (没有 / 不如). Làm hết các bài rồi bấm “Nộp bài”.",
 tags:["比","跟……一样","没有 / 不如"],
 recap:[
  {t:"1. So sánh hơn – 比",rows:[["A + 比 + B + tính từ","今天比昨天冷。"],["A + 比 + B + 更/还 + tính từ","他比我更认真。"],["A + 比 + B + tính từ + 一点儿","今天比昨天暖和一点儿。"],["A + 比 + B + tính từ + 得多/多了","他比我高得多。"],["A + 比 + B + động từ + 得 + tính từ","他比我跑得快。 / 他跑得比我快。"],["A + 比 + B + tính từ + số lượng","他比我大三岁。"]],notes:["Câu 比 không dùng 很、非常 trước tính từ.","Không đặt 不 / 没有 trực tiếp trước tính từ để tạo so sánh hơn."]},
  {t:"2. So sánh bằng – 跟……一样",rows:[["A + 跟/和 + B + 一样 + tính từ","我跟他一样高。"],["A + 跟/和 + B + 一样 + động từ + tân ngữ","我跟他一样喜欢中文。"],["A + 跟/和 + B + 不一样","我的想法跟他不一样。"]]},
  {t:"3. So sánh thua – 没有 / 不如",rows:[["A + 没有 + B + 那么/这么 + tính từ","我没有他那么高。"],["A + 不如 + B + tính từ","我不如他认真。"],["A + 不如 + B","这个手机不如那个手机。"]],notes:["A 比 B 高: A cao hơn B. A 没有 B 高: A không cao bằng B. A 不如 B 高: A kém B về chiều cao."]}
 ],
 sections:[
 {title:"一、选择正确答案",sub:"Chọn từ hoặc cấu trúc thích hợp",items:[
  {type:"mc",text:"我觉得今天____昨天冷。",opts:["跟","比","没有","一样"],ans:1,exp:"今天比昨天冷: Hôm nay lạnh hơn hôm qua."},
  {type:"mc",text:"妹妹____我一样喜欢唱歌。",opts:["比","没有","跟","不如"],ans:2,exp:"跟……一样 là cấu trúc so sánh bằng."},
  {type:"mc",text:"这个苹果没有那个苹果____甜。",opts:["比","那么","一样","更"],ans:1,exp:"没有……那么……: không … bằng …"},
  {type:"mc",text:"他每天都学习中文,所以中文说得____我好。",opts:["跟","一样","比","没有"],ans:2,exp:"说得比我好: nói tốt hơn tôi. Vế trước nói anh ấy chăm học nên giỏi hơn, vì vậy không dùng 没有."},
  {type:"mc",text:"我的房间____你的房间大,我的房间比较小。",opts:["比","没有","跟","一样"],ans:1,exp:"没有……大: không to bằng."},
  {type:"mc",text:"今天的天气比昨天____多了。",opts:["好","很好","更好","好了"],ans:0,exp:"好多了: tính từ + 多了 = hơn nhiều. Không thêm 很/更 trước tính từ."},
  {type:"mc",text:"这个问题不如那个问题____。",opts:["简单","很简单","简单得","简单了"],ans:0,exp:"不如……简单: không đơn giản bằng. Sau 不如 + B không dùng 很."},
  {type:"mc",text:"我跟哥哥____高,但是我比他胖一点儿。",opts:["比","一样","没有","不如"],ans:1,exp:"跟哥哥一样高: cao bằng anh trai."},
  {type:"mc",text:"这件衣服比那件衣服贵____。",opts:["三十块钱","三十块钱了","很三十块钱","得三十块钱"],ans:0,exp:"Số lượng chênh lệch đứng cuối câu: 贵三十块钱 = đắt hơn 30 tệ."},
  {type:"mc",text:"他比我跑得____快。",opts:["很","更","非常","最"],ans:1,exp:"他比我跑得更快: 更 biểu thị mức độ cao hơn, đứng trước 快. Không nói 他比我更跑得快."}]},
 {title:"二、选词填空",sub:"Điền từ thích hợp",items:[
  {type:"fill",bank:["比","跟","一样","没有","那么","不如","一点儿","得多"],hint:"Từ cho sẵn: 比 / 跟 / 一样 / 没有 / 那么 / 不如 / 一点儿 / 得多. Mỗi từ có thể dùng một hoặc nhiều lần.",
   parts:[
    {pre:"今天15度,昨天10度,今天的天气",ans:"比",post:"昨天暖和。"},
    {pre:"我",ans:"跟",mid:"妈妈",ans2:"一样",post:"喜欢做饭。"},
    {pre:"这个箱子",ans:"没有",post:"那个箱子那么重,我可以自己拿。"},
    {pre:"弟弟",ans:"没有",post:"哥哥那么高。"},
    {pre:"我觉得,这本书",ans:["不如","没有"],post:"那本书有意思,我更想看那本。"},
    {pre:"我的汉语水平比去年好",ans:"一点儿",post:",只进步了一点点。"},
    {pre:"这次考试比上次难",ans:"得多",post:",很多同学都没及格。"},
    {pre:"他",ans:"跟",post:"我一样,每天早上六点起床。"},
    {pre:"这家饭店的菜",ans:["不如","没有"],post:"那家饭店好吃,所以我们去那家吧。"},
    {pre:"上海的冬天",ans:"没有",post:"北京那么冷。"}],
   exp:"比 = hơn; 跟……一样 = bằng; 没有……那么 / 不如 = thua. Câu 5 và 9 dùng 不如 hoặc 没有 đều đúng. Câu có 那么 thì dùng 没有."}]},
 {title:"三、排序",sub:"Sắp xếp các từ thành câu đúng",items:[
  {type:"build",hint:"Bấm vào các từ để ghép thành câu hoàn chỉnh.",tokens:["比","我","他","高","一点儿"],accept:["我比他高一点儿","他比我高一点儿"],exp:"A + 比 + B + tính từ + 一点儿: 我比他高一点儿."},
  {type:"build",hint:"Bấm vào các từ để ghép thành câu hoàn chỉnh.",tokens:["一样","跟","妈妈","我","忙"],accept:["我跟妈妈一样忙","妈妈跟我一样忙"],exp:"A + 跟 + B + 一样 + tính từ: 我跟妈妈一样忙."},
  {type:"build",hint:"Bấm vào các từ để ghép thành câu hoàn chỉnh.",tokens:["那么","没有","今天","昨天","热"],accept:["今天没有昨天那么热","昨天没有今天那么热"],exp:"A + 没有 + B + 那么 + tính từ: 今天没有昨天那么热."},
  {type:"build",hint:"Bấm vào các từ để ghép thành câu hoàn chỉnh.",tokens:["他","比","我","更","喜欢","唱歌"],accept:["他比我更喜欢唱歌","我比他更喜欢唱歌"],exp:"A + 比 + B + 更 + động từ tâm lý: 他比我更喜欢唱歌."},
  {type:"build",hint:"Bấm vào các từ để ghép thành câu hoàn chỉnh.",tokens:["得多","这次","上次","考试","比","难"],accept:["这次考试比上次难得多","上次考试比这次难得多"],exp:"得多 đứng sau tính từ: 这次考试比上次难得多."},

function quizView(s){app.innerHTML='';const qs=[],res=h('div'),box=h('div');

  s.sections.forEach((sec,si)=>{box.append(h('h2',{class:'st'},sec.title,sec.sub?h('small',null,sec.sub):null));
